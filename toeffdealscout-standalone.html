<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Töff Deal Scout</title>
<meta name="description" content="Töff Deal Scout — Motorrad-Kaufberatung mit Deal-Score, Risiko und Verhandlungsargumenten.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF6F0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1512">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Töff Deal Scout — Stylesheet
   Basiert auf dem Original-Formular-Design, erweitert für die
   gesamte App (Landing, Admin, Report). Mobile-first & responsive.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --black:#1A1512;        /* warmes Dunkel (Header/Footer/Admin-Bar) */
  --white:#FFFFFF;
  --bg:#FAF6F0;           /* warmes Cream */
  --surface:#FFFFFF;
  --border:#EBE3D7;
  --accent:#E85D1A;
  --accent-h:#CF4E0F;
  --accent-lite:#FBEDE3;
  --text:#241D17;         /* warmes Near-Black */
  --muted:#6E655B;
  --hint:#A89E90;
  --err:#C0392B;
  --err-bg:#FBEDEB;
  --ok:#1A7A3F;
  --ok-bg:#E9F5EE;
  --warn:#B7791F;
  --warn-bg:#FAF1DD;
  --r:12px;
  --r-sm:8px;
  --font-display:'Fraunces','Space Grotesk',Georgia,serif;
  --ease:cubic-bezier(.16,.84,.44,1);
  --shadow-sm:0 1px 2px rgba(40,30,20,.05);
  --shadow:0 10px 30px rgba(40,30,20,.10);
}
html { scroll-behavior:smooth; }

/* ---------- ACCESSIBILITY ---------- */
.skip-link { position:absolute; left:-9999px; top:0; z-index:2000; background:var(--accent); color:#fff; padding:10px 16px; border-radius:0 0 8px 0; font-size:13px; font-weight:600; }
.skip-link:focus { left:0; }
.main { display:block; }
.main:focus { outline:none; }
.sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
/* Sichtbarer Fokus nur bei Tastatur-Navigation */
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
.btn-primary:focus-visible, .btn-submit:focus-visible { outline-offset:3px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

body {
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
  font-size:15px; line-height:1.6;
}
a { color:inherit; text-decoration:none; }

/* ---------- HEADER ---------- */
.hdr { background:var(--black); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.logo { font-family:'Space Grotesk','Inter',sans-serif; font-size:18px; font-weight:700; color:#fff; letter-spacing:-.3px; }
.logo em { color:var(--accent); font-style:normal; }
.hdr-nav { display:flex; align-items:center; gap:18px; }
.hdr-link { font-size:13px; color:#cfcdc8; transition:color .15s; }
.hdr-link:hover { color:#fff; }
.hdr-tag { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:.08em; }
@media(max-width:520px){ .hdr-tag{ display:none; } .hdr{ padding:14px 16px; } }

/* ---------- HERO ---------- */
.hero { background:var(--black); border-bottom:3px solid var(--accent); padding:48px 24px 52px; text-align:center; }
.hero-sm { padding:34px 24px 38px; }
.hero-eye { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:12px; }
.hero h1 { font-family:'Space Grotesk','Inter',sans-serif; font-size:clamp(24px,5vw,38px); font-weight:700; color:#fff; letter-spacing:-.4px; line-height:1.2; margin:0 auto 12px; max-width:560px; }
.hero p { font-size:14px; color:#9a978f; max-width:440px; margin:0 auto 24px; }
.hero-pills { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:24px; }
.pill { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.11); border-radius:99px; padding:5px 12px; font-size:12px; color:#9a978f; display:flex; align-items:center; gap:5px; }
.pill::before { content:"✓"; color:var(--accent); font-weight:700; }

/* ---------- BUTTONS ---------- */
.btn-primary {
  display:inline-block; padding:13px 26px; background:var(--accent); color:#fff;
  font-family:'Space Grotesk','Inter',sans-serif; font-size:15px; font-weight:700;
  border:none; border-radius:var(--r); cursor:pointer; transition:background .15s, transform .1s; letter-spacing:-.2px;
}
.btn-primary:hover { background:var(--accent-h); }
.btn-primary:active { transform:scale(.99); }
.btn-sm { padding:9px 16px; font-size:13px; }
.btn-ghost {
  display:inline-block; padding:12px 22px; background:transparent; color:var(--text);
  border:1.5px solid var(--border); border-radius:var(--r); font-size:14px; font-weight:500;
  cursor:pointer; transition:border-color .15s, background .15s; font-family:inherit;
}
.btn-ghost:hover { border-color:var(--black); }
.btn-ghost.danger { color:var(--err); border-color:transparent; }
.btn-ghost.danger:hover { border-color:var(--err); background:var(--err-bg); }
.btn-block { display:block; width:100%; text-align:center; margin-bottom:8px; }
.btn-block:last-child { margin-bottom:0; }
.link-btn { background:none; border:none; color:var(--accent); cursor:pointer; font:inherit; font-size:12px; padding:0; text-decoration:underline; }
.link-btn.danger { color:var(--err); }

/* ---------- WRAP ---------- */
.wrap { max-width:600px; margin:32px auto 64px; padding:0 16px; }
.wrap-narrow { max-width:520px; }
.wrap-wide { max-width:980px; }

/* ---------- LANDING: STEPS ---------- */
.steps { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:28px; }
@media(max-width:560px){ .steps{ grid-template-columns:1fr; } }
.step { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px 20px; }
.step-num { width:32px; height:32px; border-radius:50%; background:var(--black); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
.step-title { font-weight:600; font-size:15px; margin-bottom:6px; }
.step-text { font-size:13px; color:var(--muted); }

.cta-band { background:var(--black); border-radius:var(--r); padding:26px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; border-left:3px solid var(--accent); }
.cta-title { font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; color:#fff; }
.cta-sub { font-size:13px; color:#9a978f; margin-top:4px; }

/* ---------- FORM ---------- */
.sec { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px; margin-bottom:14px; }
.sec-head { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--hint); margin-bottom:18px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.field { margin-bottom:16px; }
.field:last-child { margin-bottom:0; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media(max-width:480px){ .row2{ grid-template-columns:1fr; } }
.mini-lbl { font-size:11px; color:var(--hint); margin-bottom:4px; }
label.lbl { display:block; font-size:13px; font-weight:500; color:var(--text); margin-bottom:5px; }
label.lbl .req { color:var(--accent); margin-left:2px; }
label.lbl .opt { font-size:11px; font-weight:400; color:var(--hint); margin-left:5px; }
.hint-text { font-size:11px; color:var(--hint); margin-top:4px; }

input[type=text], input[type=email], input[type=tel], select, textarea {
  width:100%; padding:10px 13px; font-family:inherit; font-size:14px; color:var(--text);
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r-sm);
  outline:none; transition:border-color .15s; appearance:none; -webkit-appearance:none;
}
input:focus, select:focus, textarea:focus { border-color:var(--black); }
input.err, select.err, textarea.err { border-color:var(--err)!important; background:var(--err-bg); }
input::placeholder, textarea::placeholder { color:var(--hint); }
textarea { resize:vertical; min-height:80px; line-height:1.5; }
.sel-wrap { position:relative; }
.sel-wrap::after { content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--hint); pointer-events:none; }
select { padding-right:30px; cursor:pointer; }

.err-msg { font-size:12px; color:var(--err); margin-top:4px; display:none; }
.err-msg.show { display:block; }

/* chips */
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip-wrap { position:relative; }
.chip-wrap input { position:absolute; opacity:0; width:0; height:0; }
.chip-wrap label { display:inline-flex; align-items:center; gap:5px; padding:7px 14px; border:1.5px solid var(--border); border-radius:99px; font-size:13px; color:var(--muted); cursor:pointer; transition:all .12s; user-select:none; white-space:nowrap; }
.chip-wrap input:checked + label { border-color:var(--black); background:var(--black); color:#fff; }
.chip-wrap label:hover { border-color:var(--black); }
.chips.err-chips .chip-wrap label { border-color:var(--err); }

/* packages */
.pkg-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
@media(max-width:480px){ .pkg-grid{ grid-template-columns:1fr; } }
.pkg-wrap { position:relative; }
.pkg-wrap input { position:absolute; opacity:0; width:0; height:0; }
.pkg-card { display:block; height:100%; border:1.5px solid var(--border); border-radius:var(--r); padding:14px; cursor:pointer; transition:all .15s; }
.pkg-wrap input:checked + .pkg-card { border-color:var(--black); background:var(--black); color:#fff; }
.pkg-wrap input:focus-visible + .pkg-card { outline:2px solid var(--accent); outline-offset:2px; }
.pkg-wrap input:checked + .pkg-card .pkg-sub, .pkg-wrap input:checked + .pkg-card .pkg-feat { color:#aaa; }
.pkg-wrap input:checked + .pkg-card .pkg-name { color:#888; }
.pkg-badge { display:inline-block; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:2px 7px; border-radius:4px; background:var(--accent); color:#fff; margin-bottom:7px; }
.pkg-name { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--hint); margin-bottom:5px; }
.pkg-price { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:4px; }
.pkg-price sub { font-size:13px; font-weight:500; vertical-align:baseline; }
.pkg-sub { font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.4; }
.pkg-feats { list-style:none; }
.pkg-feat { font-size:11px; color:var(--muted); padding:2px 0; display:flex; align-items:flex-start; gap:5px; }
.pkg-feat::before { content:"✓"; color:var(--accent); font-weight:700; flex-shrink:0; }

/* submit */
.submit-area { margin-top:18px; }
.btn-submit { width:100%; padding:15px 24px; background:var(--accent); color:#fff; font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; border:none; border-radius:var(--r); cursor:pointer; transition:background .15s, transform .1s; letter-spacing:-.2px; }
.btn-submit:hover { background:var(--accent-h); }
.btn-submit:active { transform:scale(.99); }
.btn-submit:disabled { background:#bbb; cursor:not-allowed; }
.submit-note { text-align:center; font-size:11px; color:var(--hint); margin-top:10px; line-height:1.7; }
.submit-note strong { color:var(--muted); }

/* ---------- SUCCESS ---------- */
.success { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:40px 24px; text-align:center; }
.ok-ico { width:56px; height:56px; border-radius:50%; background:var(--ok-bg); border:2px solid var(--ok); display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:26px; color:var(--ok); }
.ok-title { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:8px; }
.ok-text { font-size:14px; color:var(--muted); max-width:380px; margin:0 auto 16px; }
.ok-detail { background:var(--bg); border-radius:var(--r-sm); padding:14px 16px; font-size:13px; color:var(--muted); text-align:left; line-height:1.6; }
.ok-detail strong { display:block; color:var(--text); font-weight:500; margin-bottom:4px; }
.ok-meta { display:flex; justify-content:center; gap:24px; flex-wrap:wrap; margin:20px 0; padding:16px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.ok-meta > div { display:flex; flex-direction:column; gap:4px; align-items:center; }
.ok-meta span { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); }
.ok-meta strong { font-size:14px; }
.success-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

/* ---------- BADGES (Status) ---------- */
.badge { display:inline-block; font-size:11px; font-weight:600; padding:3px 10px; border-radius:99px; white-space:nowrap; border:1px solid transparent; }
.st-neu { background:var(--accent-lite); color:var(--accent-h); border-color:#f3cdb8; }
.st-in-pruefung { background:#EEF2FB; color:#2B4FB7; border-color:#cdd9f3; }
.st-report-erstellt { background:var(--ok-bg); color:var(--ok); border-color:#b8e0c6; }
.st-abgeschlossen { background:#EEEDEA; color:var(--muted); border-color:var(--border); }

/* ---------- ADMIN ---------- */
.admin-bar { background:var(--black); padding:22px 24px; }
.admin-bar-inner { max-width:980px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 16px; }
.admin-title { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:#fff; }
.admin-sub { font-size:12px; color:#9a978f; margin-top:2px; }
.back-link { font-size:12px; color:var(--accent); display:inline-block; margin-bottom:6px; }
.back-link:hover { color:#fff; }

.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.filter-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:99px; padding:7px 14px; font-size:13px; color:var(--muted); cursor:pointer; font-family:inherit; transition:all .12s; display:inline-flex; align-items:center; gap:6px; }
.filter-btn:hover { border-color:var(--black); }
.filter-btn.active { background:var(--black); border-color:var(--black); color:#fff; }
.filter-count { font-size:11px; background:rgba(0,0,0,.08); border-radius:99px; padding:1px 7px; min-width:20px; text-align:center; }
.filter-btn.active .filter-count { background:rgba(255,255,255,.18); }

.table-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
.tbl { width:100%; border-collapse:collapse; }
.tbl thead th { text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--hint); padding:12px 16px; border-bottom:1px solid var(--border); background:var(--bg); font-weight:600; }
.tbl tbody td { padding:14px 16px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
.tbl tbody tr:last-child td { border-bottom:none; }
.tbl tbody tr[data-id] { cursor:pointer; transition:background .12s; }
.tbl tbody tr[data-id]:hover { background:var(--accent-lite); }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
.muted-cell { color:var(--muted); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.empty-row { text-align:center; color:var(--muted); padding:36px 16px!important; }
.empty-row a { color:var(--accent); }
.admin-foot-note { font-size:12px; color:var(--hint); margin-top:14px; text-align:center; }

/* responsive table -> cards on mobile */
@media(max-width:620px){
  .tbl thead { display:none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display:block; width:100%; }
  .tbl tbody tr[data-id] { padding:12px 14px; border-bottom:1px solid var(--border); }
  .tbl tbody td { border:none; padding:3px 0; }
  .tbl tbody td.mono { font-weight:600; font-size:13px; }
}

/* ---------- ADMIN DETAIL ---------- */
.detail-grid { display:grid; grid-template-columns:1fr 300px; gap:16px; align-items:start; }
@media(max-width:720px){ .detail-grid{ grid-template-columns:1fr; } }
.data-block { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; margin-bottom:14px; }
.data-block-head { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--hint); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
.dl { display:grid; gap:10px; }
.dl-row { display:grid; grid-template-columns:140px 1fr; gap:12px; font-size:13px; }
@media(max-width:480px){ .dl-row{ grid-template-columns:1fr; gap:2px; } }
.dl-row dt { color:var(--hint); }
.dl-row dd { color:var(--text); }

.detail-side { position:sticky; top:16px; display:grid; gap:14px; }
@media(max-width:720px){ .detail-side{ position:static; } }
.side-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; }
.side-card-head { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--hint); margin-bottom:12px; }
.current-status { margin-bottom:12px; }
.side-pkg { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; }
.side-saved { font-size:12px; color:var(--ok); margin-top:8px; opacity:0; transition:opacity .2s; }
.side-saved.show { opacity:1; }

/* ---------- REPORT ---------- */
.report-head { background:var(--black); border-bottom:3px solid var(--accent); padding:40px 24px; }
.report-head-inner { max-width:980px; margin:0 auto; padding:0 16px; }
.report-head h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(22px,4vw,32px); font-weight:700; color:#fff; letter-spacing:-.4px; margin-bottom:10px; }
.report-summary { font-size:14px; color:#9a978f; max-width:560px; margin-bottom:16px; }
.report-meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.report-meta > span { font-size:12px; color:#cfcdc8; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.11); border-radius:99px; padding:4px 12px; }
.report-note { background:var(--warn-bg); border:1px solid #ecd9ad; color:var(--warn); font-size:13px; padding:12px 16px; border-radius:var(--r); margin-bottom:18px; }

.deals { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
@media(max-width:820px){ .deals{ grid-template-columns:1fr; } }
.deal-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; display:flex; flex-direction:column; }
.deal-rank { display:inline-block; align-self:flex-start; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#fff; background:var(--black); padding:3px 10px; border-radius:99px; margin-bottom:14px; }
.deal-top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
.deal-model { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; line-height:1.25; }
.deal-price { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--accent); white-space:nowrap; }
.deal-specs { display:flex; gap:10px; margin-bottom:16px; }
.spec { flex:1; background:var(--bg); border-radius:var(--r-sm); padding:8px 10px; }
.spec-label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); }
.spec-val { font-size:13px; font-weight:600; }

.deal-scores { display:flex; gap:12px; align-items:flex-end; margin-bottom:14px; }
.score { flex:1; }
.score-label { font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); margin-bottom:5px; }
.score-bar { height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:5px; }
.score-bar span { display:block; height:100%; background:var(--accent); border-radius:99px; }
.score-val { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }
.score-val small { color:var(--hint); font-weight:500; font-size:11px; }
.risk { text-align:right; }
.risk-val { font-weight:700; font-size:14px; padding:3px 10px; border-radius:99px; display:inline-block; }
.risk-low .risk-val { background:var(--ok-bg); color:var(--ok); }
.risk-mid .risk-val { background:var(--warn-bg); color:var(--warn); }
.risk-high .risk-val { background:var(--err-bg); color:var(--err); }

.deal-reco { font-size:13px; padding:10px 12px; border-radius:var(--r-sm); margin-bottom:14px; line-height:1.45; }
.deal-reco strong { font-weight:600; }
.reco-good { background:var(--ok-bg); color:#155f31; }
.reco-ok { background:#EEF2FB; color:#2B4FB7; }
.reco-warn { background:var(--warn-bg); color:var(--warn); }

.deal-args { margin-top:auto; }
.deal-args-head { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--hint); margin-bottom:8px; }
.deal-args ul { list-style:none; display:grid; gap:7px; }
.deal-args li { font-size:12px; color:var(--muted); padding-left:18px; position:relative; line-height:1.4; }
.deal-args li::before { content:"→"; position:absolute; left:0; color:var(--accent); font-weight:700; }

.report-actions { display:flex; justify-content:space-between; gap:12px; margin-top:24px; flex-wrap:wrap; }

/* ---------- FOOTER ---------- */
footer { background:var(--black); padding:22px 24px; font-size:11px; color:#888; line-height:1.8; }
.footer-inner { max-width:980px; margin:0 auto; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; justify-content:center; text-align:center; }
.footer-note { color:#555; width:100%; }
footer a { color:#aaa; }
footer a:hover { color:#fff; }

/* ============================================================
   ERWEITERUNGEN (Dark-Mode, Header-Controls, Charts, Dashboard,
   Report, Settings, Toasts, Print)
   ============================================================ */

/* ---------- DARK THEME ---------- */
[data-theme="dark"] {
  --white:#15140F;
  --bg:#121110;
  --surface:#1B1A18;
  --border:#2C2A26;
  --text:#F2F0EC;
  --muted:#A8A5A0;
  --hint:#75726C;
  --accent-lite:#2A1A10;
  --err-bg:#2A1715;
  --ok-bg:#13241A;
  --warn-bg:#2A2212;
}
[data-theme="dark"] .step,
[data-theme="dark"] .feat,
[data-theme="dark"] .sec,
[data-theme="dark"] .data-block,
[data-theme="dark"] .side-card,
[data-theme="dark"] .chart-card,
[data-theme="dark"] .kpi,
[data-theme="dark"] .table-card,
[data-theme="dark"] .deal-card { box-shadow:0 1px 2px rgba(0,0,0,.4); }
[data-theme="dark"] .tbl thead th { background:#211F1C; }
[data-theme="dark"] .tbl tbody tr[data-id]:hover { background:#241a12; }
[data-theme="dark"] .filter-btn,
[data-theme="dark"] .search-input,
[data-theme="dark"] select,
[data-theme="dark"] input,
[data-theme="dark"] textarea { background:var(--surface); }

/* ---------- HEADER CONTROLS ---------- */
.hdr-link.active { color:#fff; }
.hdr-link.active::after { content:""; display:block; height:2px; background:var(--accent); margin-top:3px; border-radius:2px; }
.icon-btn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; width:34px; height:34px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1; transition:background .15s; }
.icon-btn:hover { background:rgba(255,255,255,.18); }

/* ---------- LANDING EXTRAS ---------- */
.section-eye { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin:30px 0 14px; }
.feat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:10px; }
@media(max-width:780px){ .feat-grid{ grid-template-columns:1fr 1fr; } }
@media(max-width:460px){ .feat-grid{ grid-template-columns:1fr; } }
.feat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; }
.feat-ico { font-size:26px; margin-bottom:10px; }
.feat-title { font-weight:600; font-size:14px; margin-bottom:6px; }
.feat-text { font-size:12.5px; color:var(--muted); line-height:1.5; }

/* ---------- TOASTS ---------- */
.toasts { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:1000; width:max-content; max-width:92vw; }
.toast { display:flex; align-items:center; gap:9px; background:var(--black); color:#fff; padding:11px 16px; border-radius:10px; font-size:13.5px; box-shadow:0 8px 24px rgba(0,0,0,.25); opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s; border-left:3px solid var(--accent); }
.toast.in { opacity:1; transform:translateY(0); }
.toast-ico { font-weight:700; }
.toast-success { border-left-color:var(--ok); }
.toast-success .toast-ico { color:#5bd98a; }
.toast-error { border-left-color:var(--err); }
.toast-error .toast-ico { color:#ff8a7a; }

/* ---------- CHARTS ---------- */
.chart-bars { display:grid; gap:9px; }
.cb-row { display:grid; grid-template-columns:140px 1fr 56px; gap:10px; align-items:center; font-size:12.5px; }
@media(max-width:520px){ .cb-row{ grid-template-columns:100px 1fr 48px; } }
.cb-label { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cb-track { background:var(--border); border-radius:99px; height:10px; overflow:hidden; }
.cb-fill { height:100%; border-radius:99px; min-width:3px; transition:width .4s; }
.cb-val { text-align:right; font-weight:600; }
.donut { display:block; }
.donut-num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; fill:var(--text); }
.donut-sub { font-size:9px; fill:var(--hint); text-transform:uppercase; letter-spacing:.06em; }
.gauge { display:block; margin:0 auto; }
.gauge-num { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; fill:var(--text); }
.gauge-sub { font-size:9px; fill:var(--hint); }

/* ---------- DASHBOARD ---------- */
.dash-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin:18px 0 14px; }
@media(max-width:820px){ .dash-grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:420px){ .dash-grid{ grid-template-columns:1fr; } }
.kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px; }
.kpi-val { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:24px; letter-spacing:-.5px; }
.kpi-label { font-size:12px; color:var(--muted); margin-top:2px; }
.kpi-sub { font-size:10.5px; color:var(--hint); margin-top:3px; }
.dash-charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px; }
@media(max-width:720px){ .dash-charts{ grid-template-columns:1fr; } }
.chart-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px; }
.chart-card-head { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--hint); margin-bottom:14px; }
.donut-wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.legend { display:grid; gap:7px; flex:1; min-width:140px; }
.legend-row { display:flex; align-items:center; gap:8px; font-size:13px; }
.legend-dot { width:11px; height:11px; border-radius:3px; flex-shrink:0; }
.legend-val { margin-left:auto; font-weight:600; }

/* ---------- TOOLBAR / ADMIN TOOLS ---------- */
.toolbar { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.search-input { flex:1; min-width:200px; }
.toolbar-sort { min-width:170px; }
.admin-tools { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.no-shadow { box-shadow:none!important; border:none; }

/* ---------- DRAFT BAR ---------- */
.draft-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--accent-lite); border:1px solid #f3cdb8; border-radius:var(--r); padding:12px 16px; margin-bottom:14px; font-size:13px; }
[data-theme="dark"] .draft-bar { border-color:#5a3a22; }
.draft-actions { display:flex; gap:8px; }
.btn-mini { background:var(--black); color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; font-family:inherit; }
.btn-mini.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); }

/* ---------- NOTES & TIMELINE ---------- */
.note-add { display:grid; gap:8px; margin-bottom:14px; }
.note-add textarea { min-height:60px; }
.note-list { display:grid; gap:10px; }
.note-item { background:var(--bg); border-radius:var(--r-sm); padding:10px 12px; }
.note-meta { font-size:11px; color:var(--hint); margin-bottom:3px; }
.note-text { font-size:13px; white-space:pre-wrap; }
.timeline { display:grid; gap:0; }
.tl-item { display:flex; gap:10px; padding:0 0 14px; position:relative; }
.tl-item:not(:last-child)::before { content:""; position:absolute; left:5px; top:13px; bottom:0; width:2px; background:var(--border); }
.tl-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; margin-top:2px; z-index:1; }
.tl-status { font-size:13px; font-weight:600; }
.tl-time { font-size:11px; color:var(--hint); }

/* ---------- REPORT EXTRAS ---------- */
.overview-card { margin:18px 0; }
.deal-cardhead { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.deal-sub { font-size:12px; color:var(--muted); margin-bottom:6px; }
.deal-scorewrap { display:flex; justify-content:center; margin:4px 0 10px; }
.deal-pricebox { text-align:center; background:var(--bg); border-radius:var(--r-sm); padding:12px; margin-bottom:14px; }
.price-main { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:var(--accent); }
.price-sub { font-size:11.5px; color:var(--muted); margin-top:3px; }
.gap { font-weight:600; }
.gap.good { color:var(--ok); }
.gap.bad { color:var(--err); }
.gap.neutral { color:var(--muted); }
.reco-border-good { border-top:3px solid var(--ok); }
.reco-border-ok { border-top:3px solid #2B4FB7; }
.reco-border-warn { border-top:3px solid var(--warn); }
.risk-badge.risk-low { background:var(--ok-bg); color:var(--ok); border-color:#b8e0c6; }
.risk-badge.risk-mid { background:var(--warn-bg); color:var(--warn); border-color:#ecd9ad; }
.risk-badge.risk-high { background:var(--err-bg); color:var(--err); border-color:#f0c4be; }
.report-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
@media(max-width:720px){ .report-cols{ grid-template-columns:1fr; } }
.check-list { list-style:none; display:grid; gap:9px; }
.check-list li { font-size:13px; padding-left:26px; position:relative; line-height:1.4; }
.check-list li::before { content:"☐"; position:absolute; left:0; color:var(--accent); font-size:15px; }
.q-list { padding-left:20px; display:grid; gap:8px; }
.q-list li { font-size:13px; line-height:1.45; }
.compare-tbl td { vertical-align:middle; }
.report-actions-right { display:flex; gap:10px; }

/* ---------- SETTINGS ---------- */
.segmented { display:inline-flex; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; }
.seg-btn { background:var(--surface); border:none; padding:9px 20px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--muted); }
.seg-btn.active { background:var(--black); color:#fff; }
.settings-text { font-size:13px; color:var(--muted); margin-bottom:14px; }
.settings-actions { display:flex; flex-wrap:wrap; gap:8px; }

/* ---------- 404 ---------- */
.notfound { text-align:center; padding:48px 24px; }
.nf-code { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:60px; color:var(--accent); line-height:1; margin-bottom:8px; }

/* ---------- PRINT (Report als PDF) ---------- */
@media print {
  .hdr, footer, .report-actions, .report-note, .icon-btn, .toasts { display:none !important; }
  body { background:#fff; font-size:12px; }
  .report-head { background:#fff; border-bottom:2px solid var(--accent); padding:0 0 12px; }
  .report-head h1, .hero-eye { color:#000 !important; }
  .report-summary, .report-meta > span { color:#333 !important; background:none !important; border:none !important; padding:0 8px 0 0 !important; }
  .wrap, .wrap-wide { margin:8px auto; }
  .chart-card, .deal-card, .table-card { box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
  .deals { grid-template-columns:1fr 1fr; }
  .report-cols { grid-template-columns:1fr 1fr; }
  a { color:#000 !important; text-decoration:none; }
}

/* ============================================================
   HYBRID-LOOK & MOTION ("smooth")
   Warmer, hellerer Auftritt mit Serif-Headlines + sanfter Bewegung.
   Steht bewusst am Ende -> gewinnt in der Kaskade.
   ============================================================ */

/* ---- Serif-Headlines ---- */
.hero h1, .report-head h1, .admin-title, .ok-title, .cta-title {
  font-family:var(--font-display); font-weight:600; letter-spacing:-.01em;
}
.hero h1 { font-weight:600; }

/* ---- Heller, warmer Hero (statt dunkel) ---- */
.hero {
  background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  border-bottom:1px solid var(--border);
  color:var(--text);
}
.hero h1 { color:var(--text); }
.hero p { color:var(--muted); }
.hero-eye { color:var(--accent); }
.hero-pills { margin-top:26px; }
.pill { background:var(--surface); border:1px solid var(--border); color:var(--muted); box-shadow:var(--shadow-sm); }

/* ---- Report-Kopf hell & konsistent ---- */
.report-head {
  background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  border-bottom:1px solid var(--border);
}
.report-head h1 { color:var(--text); }
.report-summary { color:var(--muted); }
.report-meta > span { background:var(--surface); border:1px solid var(--border); color:var(--muted); }

/* ---- Weiche Karten-Tiefe ---- */
.sec, .step, .feat, .kpi, .chart-card, .data-block, .deal-card, .table-card, .side-card {
  box-shadow:var(--shadow-sm);
}

/* ---- Micro-Interactions (Hover-Lift) ---- */
.btn-primary, .btn-submit { transition:background .15s, transform .18s var(--ease), box-shadow .25s var(--ease); }
.btn-primary:hover, .btn-submit:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.step, .feat, .deal-card, .kpi, .chart-card { transition:transform .28s var(--ease), box-shadow .28s var(--ease); }
.step:hover, .feat:hover, .deal-card:hover, .kpi:hover, .chart-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.btn-ghost { transition:border-color .15s, background .15s, transform .18s var(--ease); }
.btn-ghost:hover { transform:translateY(-1px); }
.hdr-link { transition:color .18s, opacity .18s; }
.filter-btn, .chip-wrap label, .seg-btn, .pkg-card { transition:all .18s var(--ease); }

/* ---- Sticky, verdichtende Kopfzeile mit Backdrop-Blur ---- */
.hdr {
  position:sticky; top:0; z-index:100;
  background:rgba(26,21,18,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  transition:padding .25s var(--ease), box-shadow .25s var(--ease), background .25s var(--ease);
}
.is-scrolled .hdr { padding-top:9px; padding-bottom:9px; box-shadow:0 8px 28px rgba(0,0,0,.22); background:rgba(20,16,13,.9); }
.logo { transition:opacity .18s; }
.logo:hover { opacity:.85; }
/* Animierte Unterstreichung der Nav-Links (Hover) */
.hdr-nav .hdr-link { position:relative; }
.hdr-link:not(.active)::after {
  content:""; position:absolute; left:0; right:100%; bottom:-3px; height:2px;
  background:var(--accent); border-radius:2px; transition:right .25s var(--ease);
}
.hdr-link:not(.active):hover::after { right:0; }

/* ---- Scroll-Reveal ---- */
.reveal { opacity:0; transform:translateY(14px); transition:opacity .55s var(--ease), transform .55s var(--ease); }
.reveal.in { opacity:1; transform:none; }

/* ---- Page-In (View-Wechsel) ---- */
@keyframes pageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
#app.page-in { animation:pageIn .42s var(--ease) both; }

/* ---- Chart-Animationen ---- */
.cb-fill { transition:width .85s var(--ease); }
.gauge-fill { transition:stroke-dasharray .9s var(--ease); }
@keyframes donutIn { from { opacity:0; transform:rotate(-10deg) scale(.92); } to { opacity:1; transform:none; } }
.donut { animation:donutIn .7s var(--ease) both; transform-origin:center; }

/* ---- Toasts weicher ---- */
.toast { transition:opacity .3s var(--ease), transform .35s var(--ease); }

/* ---- Respektiert Nutzer-Einstellung ---- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  .reveal { opacity:1 !important; transform:none !important; transition:none !important; }
  #app.page-in { animation:none !important; }
  .donut { animation:none !important; }
  .cb-fill, .gauge-fill { transition:none !important; }
  .btn-primary:hover, .btn-submit:hover, .step:hover, .feat:hover, .deal-card:hover, .kpi:hover, .chart-card:hover, .btn-ghost:hover { transform:none !important; }
}

/* ============================================================
   R3 — Visuelle Politur: Hero-Tiefe & Typo-Feinschliff
   ============================================================ */
.hero { position:relative; overflow:hidden; }
.hero::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(58% 80% at 50% -12%, rgba(232,93,26,.11), transparent 62%),
    radial-gradient(42% 62% at 88% -6%, rgba(232,93,26,.06), transparent 70%);
}
.hero > * { position:relative; z-index:1; }
.hero h1 { font-size:clamp(30px,5.2vw,46px); line-height:1.08; letter-spacing:-.015em; margin-bottom:16px; }
.hero p { font-size:clamp(14px,1.6vw,16px); max-width:480px; line-height:1.6; }
.hero-sm h1 { font-size:clamp(24px,4vw,34px); }

/* Sanftes Hervorheben einzelner Wörter in Headlines (optional via <span class="accentword">) */
.accentword { color:var(--accent); }

/* Etwas mehr vertikaler Rhythmus & ruhigere Sektionen */
.section-eye { margin:36px 0 16px; }
.wrap { margin-top:36px; }
.feat { padding:22px; }
.pill { padding:6px 13px; font-size:12px; }

/* Report-Kopf bekommt denselben warmen Schimmer */
.report-head { position:relative; overflow:hidden; }
.report-head::before {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(50% 90% at 12% -20%, rgba(232,93,26,.10), transparent 60%);
}
.report-head-inner { position:relative; z-index:1; }

/* CTA-Band: subtiler Verlauf statt Flächenschwarz */
.cta-band { background:linear-gradient(120deg, #211913 0%, var(--black) 60%); }

/* ============================================================
   R4 — Vertrauenssignale / Mikrocopy
   ============================================================ */
.hero-trust { margin-top:14px; font-size:12.5px; color:var(--hint); }

/* ============================================================
   R7 — Conversion: Formular-Fortschritt & klebriger Submit (Mobile)
   ============================================================ */
.form-progress { margin-bottom:14px; }
.fp-bar { height:8px; background:var(--border); border-radius:99px; overflow:hidden; }
.fp-bar > span { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--accent), var(--accent-h)); border-radius:99px; transition:width .45s var(--ease); }
.fp-label { font-size:11.5px; color:var(--muted); margin-top:6px; text-align:right; }

@media (max-width:560px) {
  .submit-area {
    position:sticky; bottom:0; z-index:50;
    margin:0 -16px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(250,246,240,0) 0%, var(--bg) 28%);
  }
  .submit-note { margin-top:8px; }
}
[data-theme="dark"] .submit-area { background:linear-gradient(180deg, rgba(18,17,16,0) 0%, var(--bg) 28%); }
@media (prefers-reduced-motion: reduce) { .fp-bar > span { transition:none; } }

/* ============================================================
   R9–R13 — Formular-a11y: Fehler-Zusammenfassung & Gruppen
   ============================================================ */
.form-errors { background:var(--err-bg); border:1px solid #f0c4be; border-radius:var(--r); padding:14px 16px; margin-bottom:16px; color:var(--err); font-size:13.5px; }
.form-errors strong { display:block; margin-bottom:6px; }
.form-errors ul { margin:0; padding-left:18px; display:grid; gap:4px; }
.form-errors a { color:var(--err); text-decoration:underline; font-weight:500; }
.form-errors:focus { outline:2px solid var(--err); outline-offset:2px; }
[data-theme="dark"] .form-errors { border-color:#5a2a24; }

/* ============================================================
   R14–R18 — Admin: Sortierköpfe, Pagination, Toast-Aktion
   ============================================================ */
.th-sort { cursor:pointer; user-select:none; white-space:nowrap; transition:color .15s; }
.th-sort:hover { color:var(--text); }
.th-sort.active { color:var(--accent); }
.th-arrow { font-size:9px; }
.table-more { padding:12px 16px; text-align:center; border-top:1px solid var(--border); }
.table-more:empty { display:none; padding:0; border:none; }
.toast-action { margin-left:8px; background:transparent; border:1px solid rgba(255,255,255,.32); color:#fff; border-radius:6px; padding:4px 10px; font-size:12px; cursor:pointer; font-family:inherit; transition:background .15s; }
.toast-action:hover { background:rgba(255,255,255,.16); }

/* ============================================================
   R19–R23 — Dashboard-Recents, Dichte, Parallax, Press-Feedback
   ============================================================ */
.recent-list { display:grid; gap:8px; }
.recent-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r-sm); background:var(--bg); transition:background .15s, transform .15s var(--ease); }
.recent-item:hover { background:var(--accent-lite); transform:translateX(2px); }
.recent-name { font-size:13px; font-weight:500; }
.recent-time { margin-left:auto; font-size:11px; color:var(--hint); }

/* Dichte: kompakt */
[data-density="compact"] .sec,
[data-density="compact"] .data-block,
[data-density="compact"] .chart-card,
[data-density="compact"] .side-card { padding:14px; }
[data-density="compact"] .sec { margin-bottom:10px; }
[data-density="compact"] .field { margin-bottom:11px; }
[data-density="compact"] .kpi { padding:12px; }
[data-density="compact"] .tbl tbody td { padding:9px 14px; }
[data-density="compact"] .wrap { margin-top:22px; }
[data-density="compact"] .dash-grid, [data-density="compact"] .dash-charts { gap:10px; }

/* Hero-Parallax (sehr subtil) */
.hero::before { transform:translateY(calc(var(--sy, 0) * 0.04px)); }

/* Button-Press-Feedback */
.btn-primary:active, .btn-submit:active, .btn-ghost:active, .btn-sm:active, .seg-btn:active { transform:translateY(0) scale(.985); }

@media (prefers-reduced-motion: reduce) {
  .hero::before { transform:none !important; }
  .recent-item:hover { transform:none; }
}

/* ============================================================
   R24–R28 — Pricing, FAQ, Print-Header
   ============================================================ */
.pricing-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:10px; }
@media(max-width:680px){ .pricing-grid{ grid-template-columns:1fr; } }
.price-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px; display:flex; flex-direction:column; box-shadow:var(--shadow-sm); transition:transform .28s var(--ease), box-shadow .28s var(--ease); }
.price-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.price-card-rec { border-color:var(--accent); box-shadow:0 8px 30px rgba(232,93,26,.14); }
.price-card .pkg-badge { position:absolute; top:14px; right:14px; }
.price-name { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); }
.price-amount { font-family:var(--font-display); font-weight:700; font-size:30px; margin:6px 0 2px; }
.price-sub2 { font-size:12.5px; color:var(--muted); margin-bottom:12px; }
.price-feats { list-style:none; display:grid; gap:7px; margin-bottom:16px; }
.price-feats li { font-size:12.5px; color:var(--muted); padding-left:18px; position:relative; }
.price-feats li::before { content:"✓"; position:absolute; left:0; color:var(--accent); font-weight:700; }
.price-card .btn-block { margin-top:auto; }

.faq { display:grid; gap:8px; margin-bottom:10px; }
.faq-item { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:0 18px; box-shadow:var(--shadow-sm); }
.faq-item summary { cursor:pointer; padding:15px 0; font-weight:500; font-size:14.5px; list-style:none; display:flex; justify-content:space-between; align-items:center; gap:12px; }
.faq-item summary::-webkit-details-marker { display:none; }
.faq-item summary::after { content:"+"; color:var(--accent); font-size:20px; font-weight:700; transition:transform .2s var(--ease); }
.faq-item[open] summary::after { transform:rotate(45deg); }
.faq-a { padding:0 0 16px; font-size:13.5px; color:var(--muted); line-height:1.6; }

.print-only { display:none; }
@media print {
  .print-only { display:block; }
  .print-head { font-family:var(--font-display); font-weight:700; font-size:14px; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:12px; }
}

/* ============================================================
   R29–R33 — Success-Steps, Bestes-Angebot, Kontrast/forced-colors
   ============================================================ */
.next-steps { text-align:left; margin:0 auto 18px; max-width:340px; padding-left:20px; display:grid; gap:8px; }
.next-steps li { font-size:13px; color:var(--muted); line-height:1.5; }

.deal-card.is-best { border-color:var(--accent); box-shadow:0 10px 34px rgba(232,93,26,.16); }
.best-ribbon { display:inline-block; align-self:flex-start; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#fff; background:var(--accent); padding:3px 10px; border-radius:99px; margin-bottom:8px; }

/* Hoher Kontrast / Windows High-Contrast */
@media (forced-colors: active) {
  .btn-primary, .btn-submit, .badge, .pill, .pkg-badge, .best-ribbon { border:1px solid currentColor; }
  .cb-fill, .fp-bar > span, .gauge-fill { forced-color-adjust:none; }
  .reveal { opacity:1 !important; transform:none !important; }
}

/* ============================================================
   R39–R58 — SHOPIFY-STYLE MARKETING LAYER
   ============================================================ */

/* Design-Tokens: Sektionsabstände */
:root { --sp-section:72px; --maxw:1080px; }
.wrap-wide { max-width:var(--maxw); }
.section-head { text-align:center; max-width:640px; margin:var(--sp-section) auto 28px; }
.section-title { font-family:var(--font-display); font-weight:700; font-size:clamp(24px,3.4vw,34px); letter-spacing:-.01em; line-height:1.12; margin-top:6px; }

/* ---- Announcement-Bar ---- */
.annc { background:#120E0B; color:#e9e3da; font-size:12.5px; display:flex; gap:12px; align-items:center; justify-content:center; padding:8px 16px; flex-wrap:wrap; }
.annc-link { color:var(--accent); font-weight:600; }
.annc-link:hover { color:#fff; }

/* ---- Buttons: Erweiterungen ---- */
.btn-lg { padding:15px 30px; font-size:16px; }
.btn-secondary { display:inline-block; padding:13px 26px; background:var(--surface); color:var(--text); border:1.5px solid var(--border); border-radius:var(--r); font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; cursor:pointer; transition:border-color .15s, transform .18s var(--ease), box-shadow .25s; }
.btn-secondary:hover { border-color:var(--text); transform:translateY(-2px); box-shadow:var(--shadow); }
.link-arrow { display:inline-block; margin-top:14px; color:var(--accent); font-weight:600; font-size:14px; }
.link-arrow:hover { color:var(--accent-h); }

/* ---- HERO (zweispaltig) ---- */
.hero2 { position:relative; overflow:hidden; background:linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%); border-bottom:1px solid var(--border); }
.hero2::before { content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(46% 70% at 78% -10%, rgba(232,93,26,.13), transparent 62%), radial-gradient(40% 60% at 10% 0%, rgba(232,93,26,.06), transparent 70%); transform:translateY(calc(var(--sy,0)*0.03px)); }
.hero2-inner { position:relative; z-index:1; max-width:var(--maxw); margin:0 auto; padding:60px 16px 64px; display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center; }
@media(max-width:860px){ .hero2-inner{ grid-template-columns:1fr; gap:28px; padding:40px 16px 44px; text-align:center; } }
.hero2 h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(32px,5.4vw,52px); line-height:1.04; letter-spacing:-.02em; margin:10px 0 16px; }
.hero2-sub { font-size:clamp(15px,1.7vw,17px); color:var(--muted); max-width:520px; line-height:1.6; }
@media(max-width:860px){ .hero2-sub{ margin-inline:auto; } }
.hero2-cta { display:flex; gap:12px; margin:24px 0 14px; flex-wrap:wrap; }
@media(max-width:860px){ .hero2-cta{ justify-content:center; } }
.hero2-trust { font-size:13px; color:var(--muted); }
.hero2-trust .stars { color:var(--accent); letter-spacing:2px; }

/* Hero-Visual (Deal-Vorschau-Karte) */
.hero-visual { position:relative; min-height:300px; display:grid; place-items:center; }
.hv-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); }
.hv-card-main { width:min(360px,90%); padding:20px; transform:rotate(-1.5deg); }
.hv-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.hv-rank { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#fff; background:var(--accent); padding:3px 10px; border-radius:99px; }
.hv-risk { font-size:11px; font-weight:600; color:var(--ok); background:var(--ok-bg); padding:3px 10px; border-radius:99px; }
.hv-model { font-family:var(--font-display); font-weight:700; font-size:22px; }
.hv-meta { font-size:12px; color:var(--muted); margin-bottom:14px; }
.hv-score { display:flex; align-items:center; gap:16px; }
.hv-gauge { width:66px; height:66px; border-radius:50%; background:conic-gradient(var(--accent) 87%, var(--border) 0); display:grid; place-items:center; flex-shrink:0; }
.hv-gauge::before { content:""; position:absolute; width:50px; height:50px; border-radius:50%; background:var(--surface); }
.hv-gauge span { position:relative; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; }
.hv-amount { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; color:var(--accent); }
.hv-sub { font-size:12px; color:var(--ok); font-weight:600; }
.hv-bar { height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-top:14px; }
.hv-bar i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.hv-card-float { position:absolute; font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:12px; box-shadow:var(--shadow); }
.hv-f1 { top:6px; right:2%; transform:rotate(3deg); }
.hv-f2 { bottom:8px; left:0; transform:rotate(-3deg); color:var(--accent); }
@media(max-width:860px){ .hv-card-float{ display:none; } .hv-card-main{ transform:none; } }

/* ---- Trust-Leiste ---- */
.trust-strip { border-bottom:1px solid var(--border); background:var(--bg); }
.trust-strip .wrap { display:flex; align-items:center; gap:18px; flex-wrap:wrap; justify-content:center; padding-top:18px; padding-bottom:18px; }
.trust-label { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--hint); }
.trust-logos { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.trust-logo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; color:var(--muted); opacity:.75; padding:4px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); }

/* ---- Statistik-Band ---- */
.stats-band { background:var(--black); color:#fff; }
.stats-band .wrap { padding-top:36px; padding-bottom:36px; }
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; text-align:center; }
@media(max-width:680px){ .stats-grid{ grid-template-columns:1fr 1fr; gap:24px 12px; } }
.stat-num { font-family:var(--font-display); font-weight:700; font-size:clamp(26px,4vw,38px); color:#fff; }
.stat-label { font-size:13px; color:#e7e1d8; margin-top:2px; }
.stat-sub { font-size:11px; color:#9a948b; margin-top:2px; }

/* ---- Feature-Blöcke ---- */
.feature-block { padding:8px 0; }
.fb-grid { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; margin-top:var(--sp-section); }
@media(max-width:820px){ .fb-grid{ grid-template-columns:1fr; gap:22px; } .feature-block.flip .fb-body{ order:2; } }
.fb-eye { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); margin-bottom:8px; }
.fb-title { font-family:var(--font-display); font-weight:700; font-size:clamp(22px,3vw,30px); letter-spacing:-.01em; line-height:1.15; }
.fb-text { color:var(--muted); margin:10px 0 14px; line-height:1.6; }
.fb-list { list-style:none; display:grid; gap:8px; }
.fb-list li { position:relative; padding-left:26px; font-size:14px; }
.fb-list li::before { content:"✓"; position:absolute; left:0; top:-1px; color:#fff; background:var(--accent); width:18px; height:18px; border-radius:50%; font-size:11px; font-weight:700; display:grid; place-items:center; }
.fb-media { display:grid; place-items:center; }
.illu { width:100%; max-width:360px; height:auto; filter:drop-shadow(0 12px 30px rgba(40,30,20,.10)); }

/* ---- Stepper ---- */
.stepper { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; position:relative; }
@media(max-width:680px){ .stepper{ grid-template-columns:1fr; } }
.step2 { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:24px; box-shadow:var(--shadow-sm); }
.step2-num { width:38px; height:38px; border-radius:50%; background:var(--accent); color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; display:grid; place-items:center; margin-bottom:14px; }
.step2-title { font-weight:600; font-size:16px; margin-bottom:6px; }
.step2-text { font-size:13.5px; color:var(--muted); line-height:1.55; }

/* ---- Testimonials ---- */
.testi-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media(max-width:780px){ .testi-grid{ grid-template-columns:1fr; } }
.testi { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:24px; box-shadow:var(--shadow-sm); margin:0; }
.testi-stars { color:var(--accent); letter-spacing:2px; margin-bottom:10px; }
.testi blockquote { font-size:15px; line-height:1.55; margin:0 0 14px; }
.testi figcaption { display:flex; flex-direction:column; gap:1px; }
.testi-name { font-weight:600; font-size:13px; }
.testi-meta { font-size:12px; color:var(--hint); }

/* ---- Pricing (Ergänzung) ---- */
.pricing-note { text-align:center; font-size:13px; color:var(--muted); margin-top:14px; }

/* ---- Finale CTA ---- */
.cta-hero { margin:var(--sp-section) 0 24px; border-radius:20px; background:linear-gradient(120deg,#2a1d13 0%, var(--black) 55%); border:1px solid rgba(255,255,255,.06); position:relative; overflow:hidden; }
.cta-hero::after { content:""; position:absolute; inset:0; background:radial-gradient(40% 120% at 80% 0%, rgba(232,93,26,.25), transparent 60%); }
.cta-hero-inner { position:relative; z-index:1; text-align:center; padding:48px 24px; }
.cta-hero h2 { font-family:var(--font-display); font-weight:700; font-size:clamp(24px,3.4vw,34px); color:#fff; }
.cta-hero p { color:#cdc6bc; margin:8px 0 22px; }

/* ---- Mega-Footer ---- */
.footer { background:var(--black); color:#c9c2b8; padding:0; }
.footer-top { max-width:var(--maxw); margin:0 auto; padding:48px 16px 28px; display:grid; grid-template-columns:1.4fr 2fr; gap:36px; }
@media(max-width:760px){ .footer-top{ grid-template-columns:1fr; gap:28px; } }
.logo-foot { color:#fff; font-size:20px; }
.foot-tag { font-size:13px; color:#9a948b; line-height:1.6; margin:12px 0 16px; max-width:340px; }
.newsletter { display:flex; gap:8px; max-width:380px; }
.newsletter input { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); color:#fff; border-radius:var(--r-sm); padding:11px 13px; flex:1; font-size:14px; }
.newsletter input::placeholder { color:#8a857c; }
.foot-cols { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
@media(max-width:520px){ .foot-cols{ grid-template-columns:1fr 1fr; } }
.foot-head { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:#fff; margin-bottom:12px; }
.foot-col ul { list-style:none; display:grid; gap:9px; }
.foot-col a { color:#b3aca2; font-size:13.5px; }
.foot-col a:hover { color:#fff; }
.footer-bottom { border-top:1px solid rgba(255,255,255,.08); max-width:var(--maxw); margin:0 auto; padding:18px 16px; display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; justify-content:space-between; font-size:11.5px; color:#857f76; }
.foot-social { display:flex; gap:10px; }
.foot-social a { color:#b3aca2; font-size:15px; }
.foot-social a:hover { color:var(--accent); }

/* ---- Hover-Lifts neue Karten ---- */
.step2, .testi, .price-card, .hv-card-main { transition:transform .28s var(--ease), box-shadow .28s var(--ease); }
.step2:hover, .testi:hover { transform:translateY(-3px); box-shadow:var(--shadow); }

@media (prefers-reduced-motion: reduce) {
  .hero2::before { transform:none !important; }
  .step2:hover, .testi:hover { transform:none; }
}

/* ============================================================
   R50–R56 — Token-/Elevation-/Politur-Refinements
   ============================================================ */
:root { --shadow-lg:0 24px 60px rgba(40,30,20,.16); }
.hv-card-main { box-shadow:var(--shadow-lg); }

/* Empfohlenes Paket hervorheben (Shopify-typisch) */
.pricing-grid { align-items:stretch; }
.price-card-rec { transform:translateY(-8px); }
.price-card-rec:hover { transform:translateY(-11px); }
@media(max-width:680px){ .price-card-rec{ transform:none; } .price-card-rec:hover{ transform:translateY(-3px); } }

/* Anker-Offset wegen Sticky-Header */
section[id], .section-head { scroll-margin-top:80px; }

/* Dark-Mode-Feinschliff für neue Sektionen */
[data-theme="dark"] .trust-logo { opacity:.9; }
[data-theme="dark"] .hero2, [data-theme="dark"] .trust-strip { border-color:#2C2A26; }
[data-theme="dark"] .newsletter input { background:rgba(255,255,255,.05); }
[data-theme="dark"] .illu { filter:drop-shadow(0 12px 30px rgba(0,0,0,.4)); }

/* Report-KPIs (Produktseiten-Gefühl) */
.report-kpis { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.report-kpi { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow-sm); }
.report-kpi b { font-family:'Space Grotesk',sans-serif; font-size:18px; display:block; }
.report-kpi span { font-size:11px; color:var(--hint); text-transform:uppercase; letter-spacing:.05em; }

@media (prefers-reduced-motion: reduce) { .price-card-rec, .price-card-rec:hover { transform:none; } }

/* ============================================================
   R59–R64 — DSG-Checkbox, Legal-Seiten, Live-Hero, Demo-Labels, Quick-Score
   ============================================================ */
/* DSG-Checkbox als Fliesstext (überschreibt Chip-Styling) */
.chip-check { display:block; }
#dsg-wrap { display:flex; gap:10px; align-items:flex-start; }
#dsg-wrap input { position:static; opacity:1; width:18px; height:18px; flex-shrink:0; margin-top:2px; accent-color:var(--accent); }
#dsg-wrap label { white-space:normal; line-height:1.5; border:none; padding:0; background:none; color:var(--text); font-size:13px; cursor:pointer; display:inline; }
#dsg-wrap label:hover { border:none; }
#dsg-wrap input:checked + label { background:none; color:var(--text); border:none; }
#dsg-wrap label a { color:var(--accent); }
.chips.err-chips #dsg-wrap label, #dsg-wrap[aria-invalid] label { color:var(--text); }

/* Live-Hero Risiko-Farben */
.hv-risk-low  { color:var(--ok);   background:var(--ok-bg); }
.hv-risk-mid  { color:var(--warn); background:var(--warn-bg); }
.hv-risk-high { color:var(--err);  background:var(--err-bg); }

/* Demo-Label über den Statistiken */
.stats-demo-label { text-align:center; font-size:12px; color:#9a978f; margin-bottom:12px; letter-spacing:.04em; text-transform:uppercase; }

/* Legal-Seiten */
.legal h2 { font-family:var(--font-display); font-size:18px; margin:18px 0 6px; }
.legal p { color:var(--muted); margin-bottom:10px; line-height:1.6; }
.legal a { color:var(--accent); }

/* Quick-Score-Widget */
.quick-score-section { margin-top:28px; }
.qs-card { box-shadow:var(--shadow); }
.qs-card #qs-btn { margin-top:4px; }
.qs-result { margin-top:14px; }
.qs-result:empty { display:none; }
.qs-hint { font-size:12.5px; color:var(--muted); margin-top:8px; }
.qs-out { display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--bg); border-radius:var(--r-sm); padding:14px; }
.qs-badge { width:54px; height:54px; border-radius:14px; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; display:grid; place-items:center; flex-shrink:0; }
.qs-info { flex:1; min-width:160px; }
.qs-title { font-weight:600; }
.qs-sub { font-size:12.5px; color:var(--muted); margin-top:2px; }

/* ============================================================
   R65–R74 — Echte Unterseiten (Über uns, Preise, Kontakt, Ratgeber) + Footer 4-spaltig
   ============================================================ */
/* Footer: vier Spalten */
.foot-cols { grid-template-columns:repeat(4,1fr); }
@media(max-width:760px){ .foot-cols{ grid-template-columns:1fr 1fr; } }

/* Über uns */
.about-lead { font-size:15.5px; line-height:1.7; }
.about-lead p { margin-bottom:12px; }
.about-lead p:last-child { margin-bottom:0; }
.values-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
@media(max-width:780px){ .values-grid{ grid-template-columns:1fr 1fr; } }
@media(max-width:460px){ .values-grid{ grid-template-columns:1fr; } }
.value-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; box-shadow:var(--shadow-sm); transition:transform .28s var(--ease), box-shadow .28s var(--ease); }
.value-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.value-ico { font-size:24px; margin-bottom:10px; }
.value-title { font-weight:600; margin-bottom:5px; }
.value-text { font-size:13px; color:var(--muted); line-height:1.55; }

/* Preise: Vergleichstabelle */
.cmp-table th[scope="row"] { text-align:left; font-weight:500; }
.cmp-table thead th { font-family:'Space Grotesk',sans-serif; }
.cmp-table td { text-align:center; }
.cmp-table .cmp-yes { color:var(--ok); font-weight:700; }
.cmp-table .cmp-no { color:var(--hint); }
.cmp-table tbody tr:hover { background:var(--accent-lite); }

/* Kontakt */
.contact-rows { display:grid; gap:14px; }
.contact-row { display:flex; gap:14px; align-items:flex-start; }
.contact-ico { width:40px; height:40px; border-radius:12px; background:var(--accent-lite); color:var(--accent); display:grid; place-items:center; font-size:18px; flex-shrink:0; }
.contact-k { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--hint); }
.contact-row a { color:var(--accent); }

/* Ratgeber */
.guide-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
@media(max-width:820px){ .guide-grid{ grid-template-columns:1fr 1fr; } }
@media(max-width:520px){ .guide-grid{ grid-template-columns:1fr; } }
.guide-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:22px; box-shadow:var(--shadow-sm); transition:transform .28s var(--ease), box-shadow .28s var(--ease); }
.guide-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }

/*
 * services/store.js — Datenzugriffsschicht (Repository-Pattern).
 *
 * Kapselt die gesamte Persistenz hinter einer Promise-basierten API.
 * Heute: LocalStorage über einen austauschbaren Adapter. Für ein echtes
 * Backend genügt es, einen anderen Adapter zu setzen (z.B. RestAdapter
 * mit fetch) — die Views bleiben unverändert.
 *
 * Zusatzfeatures gegenüber MVP:
 *  - versioniertes Schema inkl. Migration von v1
 *  - Status-Historie (Audit-Trail) je Anfrage
 *  - interne Notizen
 *  - Events bei Änderungen (data:change) für reaktive Views
 *  - Export/Import (JSON) und Statistik-Aggregation
 */
(function (global) {
  'use strict';

  var cfg = global.TDS.config;
  var events = global.TDS.events;

  var KEY = 'tds_db_v2';
  var LEGACY_KEY = 'tds_requests_v1';
  var SCHEMA = 2;

  /* ---------------- Adapter ---------------- */
  function LocalStorageAdapter(key) {
    return {
      read: function () {
        try {
          var raw = global.localStorage.getItem(key);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { console.warn('Store read error', e); return null; }
      },
      write: function (db) {
        global.localStorage.setItem(key, JSON.stringify(db));
      }
    };
  }

  // In-Memory-Adapter (v.a. für Tests).
  function MemoryAdapter() {
    var data = null;
    return {
      read: function () { return data; },
      write: function (db) { data = JSON.parse(JSON.stringify(db)); }
    };
  }

  var adapter = LocalStorageAdapter(KEY);

  /* ---------------- intern ---------------- */
  function emptyDb() { return { v: SCHEMA, requests: [] }; }

  function migrateLegacy() {
    try {
      var raw = global.localStorage.getItem(LEGACY_KEY);
      if (!raw) return null;
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      var db = emptyDb();
      db.requests = arr.map(function (r) {
        return normalize({
          id: r.id, createdAt: r.createdAt, updatedAt: r.updatedAt || r.createdAt,
          status: r.status || cfg.DEFAULT_STATUS, values: r.values || {},
          history: [{ status: r.status || cfg.DEFAULT_STATUS, at: r.createdAt }],
          notes: []
        });
      });
      return db;
    } catch (e) { return null; }
  }

  function normalize(r) {
    r.history = r.history || [{ status: r.status, at: r.createdAt }];
    r.notes = r.notes || [];
    return r;
  }

  function load() {
    var db = adapter.read();
    if (!db) {
      db = migrateLegacy() || emptyDb();
      adapter.write(db);
    }
    if (db.v !== SCHEMA) { db.v = SCHEMA; } // Platz für künftige Migrationen
    db.requests = db.requests.map(normalize);
    return db;
  }

  function save(db) {
    adapter.write(db);
    if (events) events.emit('data:change', { count: db.requests.length });
  }

  function genId() {
    var rnd = Math.random().toString(36).slice(2, 8).toUpperCase();
    return 'TDS-' + rnd;
  }

  function sortByDate(list) {
    return list.slice().sort(function (a, b) { return new Date(b.createdAt) - new Date(a.createdAt); });
  }

  /* ---------------- öffentliche API ---------------- */
  var Store = {
    /** Adapter wechseln (z.B. Tests oder späteres Backend). */
    _useAdapter: function (a) { adapter = a; },
    _memoryAdapter: MemoryAdapter,

    list: function (filter) {
      var rows = sortByDate(load().requests);
      if (filter && filter.status && filter.status !== 'Alle') {
        rows = rows.filter(function (r) { return r.status === filter.status; });
      }
      if (filter && filter.q) {
        var q = filter.q.toLowerCase();
        rows = rows.filter(function (r) { return matchQuery(r, q); });
      }
      return Promise.resolve(rows);
    },

    get: function (id) {
      var found = load().requests.filter(function (r) { return r.id === id; })[0] || null;
      return Promise.resolve(found);
    },

    create: function (values) {
      var db = load();
      var now = new Date().toISOString();
      var record = normalize({
        id: genId(), createdAt: now, updatedAt: now,
        status: cfg.DEFAULT_STATUS, values: values,
        history: [{ status: cfg.DEFAULT_STATUS, at: now }], notes: []
      });
      db.requests.push(record);
      save(db);
      return Promise.resolve(record);
    },

    updateStatus: function (id, status) {
      var db = load(); var updated = null; var now = new Date().toISOString();
      db.requests.forEach(function (r) {
        if (r.id === id && r.status !== status) {
          r.status = status; r.updatedAt = now;
          r.history.push({ status: status, at: now });
          updated = r;
        }
      });
      if (updated) save(db);
      return Promise.resolve(updated);
    },

    addNote: function (id, text) {
      var db = load(); var updated = null; var now = new Date().toISOString();
      db.requests.forEach(function (r) {
        if (r.id === id) {
          r.notes.push({ text: text, at: now });
          r.updatedAt = now; updated = r;
        }
      });
      if (updated) save(db);
      return Promise.resolve(updated);
    },

    /** Löscht eine Anfrage und liefert den gelöschten Datensatz (für Undo) zurück. */
    remove: function (id) {
      var db = load();
      var removed = db.requests.filter(function (r) { return r.id === id; })[0] || null;
      db.requests = db.requests.filter(function (r) { return r.id !== id; });
      save(db);
      return Promise.resolve(removed);
    },

    /** Stellt einen zuvor gelöschten Datensatz unverändert wieder her (Undo). */
    restore: function (record) {
      if (!record || !record.id) return Promise.resolve(null);
      var db = load();
      if (!db.requests.some(function (r) { return r.id === record.id; })) {
        db.requests.push(normalize(record));
        save(db);
      }
      return Promise.resolve(record);
    },

    /** Leert alle Anfragen und liefert die vorherige Liste (für Undo) zurück. */
    clear: function () {
      var prev = load().requests;
      save(emptyDb());
      return Promise.resolve(prev);
    },

    /** Mehrere Datensätze wiederherstellen (Undo von "Alle löschen"). */
    restoreMany: function (records) {
      var db = emptyDb();
      db.requests = (records || []).map(normalize);
      save(db);
      return Promise.resolve(db.requests.length);
    },

    /** Statistik-Aggregation für das Dashboard. */
    stats: function () {
      var rows = load().requests;
      var byStatus = {}; cfg.STATUSES.forEach(function (s) { byStatus[s] = 0; });
      var byCountry = {}, byPackage = {};
      var weekAgo = Date.now() - 7 * 864e5;
      var last7 = 0, budgetSum = 0, budgetN = 0;

      rows.forEach(function (r) {
        byStatus[r.status] = (byStatus[r.status] || 0) + 1;
        var land = (r.values.landLabel || r.values.land || '–');
        byCountry[land] = (byCountry[land] || 0) + 1;
        var pkg = r.values.paket || '–';
        byPackage[pkg] = (byPackage[pkg] || 0) + 1;
        if (new Date(r.createdAt).getTime() >= weekAgo) last7++;
        var von = parseInt(r.values.budget_von), bis = parseInt(r.values.budget_bis);
        if (von && bis) { budgetSum += (von + bis) / 2; budgetN++; }
      });

      var done = (byStatus['Report erstellt'] || 0) + (byStatus['Abgeschlossen'] || 0);
      return Promise.resolve({
        total: rows.length,
        last7: last7,
        open: (byStatus['Neu'] || 0) + (byStatus['In Prüfung'] || 0),
        done: done,
        conversion: rows.length ? Math.round((done / rows.length) * 100) : 0,
        avgBudget: budgetN ? Math.round(budgetSum / budgetN) : 0,
        byStatus: byStatus, byCountry: byCountry, byPackage: byPackage
      });
    },

    /** Vollständiger Export als JSON-String. */
    exportJSON: function () {
      return Promise.resolve(JSON.stringify(load(), null, 2));
    },

    /**
     * Import. mode 'replace' ersetzt, 'merge' fügt neue IDs hinzu.
     * @returns {Promise<{imported:number, skipped:number}>}
     */
    importJSON: function (jsonStr, mode) {
      return new Promise(function (resolve, reject) {
        try {
          var incoming = JSON.parse(jsonStr);
          var list = Array.isArray(incoming) ? incoming : (incoming.requests || []);
          if (!Array.isArray(list)) throw new Error('Kein gültiges Datenformat.');
          var db = mode === 'merge' ? load() : emptyDb();
          var existing = {}; db.requests.forEach(function (r) { existing[r.id] = true; });
          var imported = 0, skipped = 0;
          list.forEach(function (r) {
            if (!r || !r.id) { skipped++; return; }
            if (existing[r.id]) { skipped++; return; }
            db.requests.push(normalize(r)); existing[r.id] = true; imported++;
          });
          save(db);
          resolve({ imported: imported, skipped: skipped });
        } catch (e) { reject(e); }
      });
    }
  };

  function matchQuery(r, q) {
    var v = r.values;
    var hay = [r.id, v.vorname, v.nachname, v.email, v.modell, v.region, v.landLabel, v.paket,
      (Array.isArray(v.stil) ? v.stil.join(' ') : v.stil)].join(' ').toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  global.TDS = global.TDS || {};
  global.TDS.store = Store;
})(window);
