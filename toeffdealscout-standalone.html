  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function makeRng(seedStr) {
    var seed = cyrb53(seedStr || 'tds', 1);
    return mulberry32(seed);
  }

  /* ---------- Helfer ---------- */
  function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
  function round(n, step) { step = step || 1; return Math.round(n / step) * step; }

  function parseKm(s) {
    if (!s) return null;
    var digits = String(s).replace(/[^\d]/g, '');
    if (!digits) return null; // "Egal", "Keine Präferenz"
    return parseInt(digits, 10);
  }
  function parseYear(s) {
    var y = parseInt(s, 10);
    return (y && y > 1990) ? y : null;
  }

  /* ---------- Constraints aus Anfrage ---------- */
  function constraints(values) {
    var styles = (values.stil || []).map(function (label) { return cfg.STYLE_KEYS[label] || 'any'; });
    var anyStyle = styles.length === 0 || styles.indexOf('any') !== -1;
    var kwCap = cfg.LICENSE_KW[values.ausweis];
    if (kwCap === undefined) kwCap = Infinity;
    var von = parseInt(values.budget_von, 10) || 3000;
    var bis = parseInt(values.budget_bis, 10) || Math.max(von + 2000, 8000);
    return {
      styles: anyStyle ? null : styles,
      a2required: kwCap <= 35,
      kwCap: kwCap,
      budgetVon: von, budgetBis: bis,
      currency: values.waehrung || cfg.currencyFor(values.land),
      yearFrom: parseYear(values.baujahr),
      maxKm: parseKm(values.km),
      modelPref: (values.modell || '').trim(),
      region: values.region || '–',
      land: values.land
    };
  }

  /* ---------- Kandidaten wählen ---------- */
  function candidates(c, count) {
    var pool = [];
    var seen = {};
    function add(list) {
      list.forEach(function (m) {
        var key = m.brand + m.model;
        if (!seen[key]) { seen[key] = true; pool.push(m); }
      });
    }
    if (c.modelPref) add(market.search(c.modelPref));
    if (c.styles) c.styles.forEach(function (s) { add(market.byStyle(s)); });
    else add(market.all());

    // A2-Filter: a2-Flag = A2-tauglich bzw. drosselbar (volle kW egal).
    if (c.a2required) pool = pool.filter(function (m) { return m.a2; });

    // Auffüllen, falls nach Filter zu wenige Kandidaten.
    if (pool.length < count) {
      add(c.a2required ? market.all().filter(function (m) { return m.a2; }) : market.all());
    }

    // Fit-Score: Budget-Nähe + Zuverlässigkeit + Modell-Treffer
    var mid = (c.budgetVon + c.budgetBis) / 2;
    pool.forEach(function (m) {
      var priceDist = Math.abs(m.refPrice - mid) / Math.max(mid, 1);
      var modelHit = c.modelPref && (m.brand + ' ' + m.model).toLowerCase().indexOf(c.modelPref.toLowerCase()) !== -1;
      m._fit = (modelHit ? 3 : 0) + (1 - clamp(priceDist, 0, 1)) + m.reliability * 0.15;
    });
    pool.sort(function (a, b) { return b._fit - a._fit; });
    return pool.slice(0, count);
  }

  /* ---------- ein Listing + Bewertung ---------- */
  var ASK_RANGES = [[0.88, 0.96], [0.97, 1.05], [1.06, 1.16], [0.94, 1.04], [1.00, 1.12]];
  var CONDITIONS = [
    { label: 'sehr gut', w: 3, bonus: 0.8, risk: -6 },
    { label: 'gut', w: 5, bonus: 0.3, risk: 0 },
    { label: 'mittel', w: 3, bonus: -0.4, risk: 10 },
    { label: 'mit Mängeln', w: 1, bonus: -1.2, risk: 22 }
  ];

  function weighted(rng, items) {
    var total = items.reduce(function (s, i) { return s + i.w; }, 0);
    var r = rng() * total;
    for (var i = 0; i < items.length; i++) { r -= items[i].w; if (r <= 0) return items[i]; }
    return items[items.length - 1];
  }

  function buildDeal(model, rank, c, rng) {
    var cur = c.currency;

    // Jahr (respektiert "Baujahr ab")
    var minYear = Math.max(c.yearFrom || 2013, 2013, model.refYear - 5);
    var maxYear = Math.min(2024, model.refYear + 2);
    if (minYear > maxYear) minYear = maxYear;
    var year = Math.round(minYear + rng() * (maxYear - minYear));

    var age = Math.max(0, NOW_YEAR - year);
    var expectedKm = 4000 + age * 5500;
    var km = round(expectedKm * (0.6 + rng() * 0.9), 500);
    if (c.maxKm) km = Math.min(km, c.maxKm);
    km = Math.max(1500, km);

    var cond = weighted(rng, CONDITIONS);
    var seller = rng() < 0.62 ? 'privat' : 'Händler';
    var serviceHistory = rng() < (cond.label === 'sehr gut' ? 0.85 : 0.55);
    var freshMfk = c.land === 'CH' ? rng() < 0.5 : false;

    // Marktwert
    var yearFactor = Math.pow(1 - model.depr, model.refYear - year);
    var kmFactor = clamp(1 - (km - market.REF_KM) / 10000 * 0.04, 0.6, 1.2);
    var marketValue = model.refPrice * yearFactor * kmFactor * (1 + cond.bonus * 0.04);

    // Angebotspreis
    var rangeIdx = Math.min(rank, ASK_RANGES.length - 1);
    var rg = ASK_RANGES[rangeIdx];
    var askMult = rg[0] + rng() * (rg[1] - rg[0]);
    if (seller === 'Händler') askMult += 0.04; // Gewährleistung -> teurer
    var asking = marketValue * askMult;
    // in Budget halten
    asking = clamp(asking, c.budgetVon, c.budgetBis);
    asking = round(asking, 50);

    var gap = (marketValue - asking) / marketValue; // >0 = unter Marktwert

    // Deal-Score
    var kmRel = (km - expectedKm) / expectedKm;
    var score = 6
      + gap * 22
      + cond.bonus
      + (model.reliability - 3) * 0.4
      + clamp(-kmRel * 1.5, -1.2, 0.8)
      + (serviceHistory ? 0.5 : -0.4)
      + (seller === 'Händler' ? 0.2 : 0);
    score = clamp(score, 1.5, 9.8);
    score = Math.round(score * 10) / 10;

    // Risiko
    var risk = 10
      + age * 3.2
      + Math.max(0, kmRel) * 22
      + cond.risk
      + (3 - model.reliability) * 7
      + (model.parts === 'hoch' ? 10 : model.parts === 'mittel' ? 3 : 0)
      + (serviceHistory ? -6 : 8)
      + (seller === 'privat' ? 4 : 0)
      + model.issues.length * 2;
    risk = Math.round(clamp(risk, 5, 95));
    var riskLevel = risk < 34 ? 'low' : risk < 64 ? 'mid' : 'high';
    var riskLabel = riskLevel === 'low' ? 'Niedrig' : riskLevel === 'mid' ? 'Mittel' : 'Höher';

    // Empfehlung
    var reco;
    if (score >= 7.5 && riskLevel !== 'high') reco = { level: 'good', text: 'Top-Deal — wenig Risiko, schnell handeln.' };
    else if (score >= 6 && riskLevel !== 'high') reco = { level: 'ok', text: 'Solide — mit gezielten Fragen nachverhandeln.' };
    else if (riskLevel === 'high') reco = { level: 'warn', text: 'Erhöhtes Risiko — nur mit MFK/Gutachten kaufen.' };
    else reco = { level: 'ok', text: 'Brauchbar — Preis vor Ort nachverhandeln.' };

    return {
      rank: rank,
      brand: model.brand,
      model: model.model,
      title: model.brand + ' ' + model.model,
      year: year,
      km: km,
      condition: cond.label,
      seller: seller,
      serviceHistory: serviceHistory,
      freshMfk: freshMfk,
      location: c.region,
      currency: cur,
      asking: asking,
      marketValue: Math.round(marketValue),
      valueGapPct: Math.round(gap * 100),
      score: score,
      risk: { score: risk, level: riskLevel, label: riskLabel },
      recommendation: reco,
      reliability: model.reliability,
      parts: model.parts,
      issues: model.issues.slice(),
      negotiationArgs: negotiation(model, { asking: asking, marketValue: marketValue, gap: gap, km: km, expectedKm: expectedKm, cond: cond.label, seller: seller, serviceHistory: serviceHistory }, cur),
      inspectionPoints: inspection(model, cond.label),
      sellerQuestions: questions(model, seller, serviceHistory)
    };
  }

  function negotiation(model, d, cur) {
    var args = [];
    var diff = Math.round(Math.abs(d.marketValue - d.asking));
    if (d.gap < -0.01) args.push('Preis ~' + fmt.money(diff, cur) + ' über Marktwert (Ø ' + fmt.money(d.marketValue, cur) + ') → Nachlass fordern.');
    else if (d.gap > 0.03) args.push('Bereits ' + fmt.money(diff, cur) + ' unter Marktwert — zügig zusagen, nur kleiner Puffer nötig.');
    else args.push('Preis nahe Marktwert (Ø ' + fmt.money(d.marketValue, cur) + ') — Spielraum über Mängel/Service holen.');
    if (d.km > d.expectedKm * 1.15) args.push('Überdurchschnittliche Laufleistung (' + fmt.km(d.km) + ') → Verschleissteile einpreisen.');
    if (d.cond === 'mittel' || d.cond === 'mit Mängeln') args.push('Sichtbare Mängel → Kostenvoranschlag als Hebel nutzen.');
    if (!d.serviceHistory) args.push('Kein lückenloses Serviceheft → Abschlag für unklare Wartung.');
    if (d.seller === 'Händler') args.push('Händler → Gewährleistung & ggf. frische MFK schriftlich sichern.');
    else args.push('Privatkauf → Probefahrt und Kaltstart-Check vor Zusage vereinbaren.');
    return args.slice(0, 4);
  }

  function inspection(model, cond) {
    var base = ['Rahmen-/Motornummern mit Ausweis abgleichen', 'Reifen-Alter (DOT) & Profil', 'Bremsbeläge & -scheiben', 'Gabel auf Ölverlust', 'Elektrik/Beleuchtung & Kaltstart'];
    var pts = model.issues.concat(base);
    if (cond === 'mit Mängeln') pts.unshift('Unfall-/Sturzschäden genau dokumentieren');
    // Duplikate raus
    var seen = {}, out = [];
    pts.forEach(function (p) { if (!seen[p]) { seen[p] = true; out.push(p); } });
    return out.slice(0, 6);
  }

  function questions(model, seller, serviceHistory) {
    var q = ['Warum wird verkauft / wie lange im Besitz?', 'Sturz-, Unfall- oder Trackday-Historie?', 'Letzter Service – wann, wo, was gemacht?'];
    if (!serviceHistory) q.push('Liegen Servicebelege/Rechnungen vor?');
    if (seller === 'Händler') q.push('Welche Gewährleistung / Garantie ist inklusive?');
    else q.push('Ist eine Probefahrt möglich (mit Anzahlung/Ausweis)?');
    q.push('Bekannte Mängel oder anstehende Arbeiten?');
    return q.slice(0, 5);
  }

  /* ---------- öffentliche API ---------- */
  function generate(record) {
    var values = record.values || record;
    var c = constraints(values);
    var pkg = cfg.packageById(values.paket);
    var count = clamp(pkg ? pkg.dealCount : 3, 1, 5);
    var rng = makeRng(record.id || 'preview');

    var picks = candidates(c, count);
    var deals = picks.map(function (m, i) { return buildDeal(m, i, c, rng); });
    deals.sort(function (a, b) { return b.score - a.score; });
    deals.forEach(function (d, i) { d.rank = i; });

    var scores = deals.map(function (d) { return d.score; });
    var avg = scores.length ? scores.reduce(function (s, x) { return s + x; }, 0) / scores.length : 0;
    var srcs = (cfg.REGIONS[c.land] && cfg.REGIONS[c.land].sources) || ['anibis.ch', 'tutti.ch'];

    return {
      deals: deals,
      summary: {
        count: deals.length,
        region: c.region,
        currency: c.currency,
        budgetVon: c.budgetVon,
        budgetBis: c.budgetBis,
        modelFocus: c.modelPref || (values.stil && values.stil.length ? values.stil.join(', ') : 'verschiedene Stile'),
        avgScore: Math.round(avg * 10) / 10,
        bestScore: scores.length ? Math.max.apply(null, scores) : 0,
        sources: srcs
      }
    };
  }

  global.TDS = global.TDS || {};
  global.TDS.scout = { generate: generate, _constraints: constraints, _makeRng: makeRng };
})(window);

/* ===== js/router.js ===== */
/*
 * router.js — minimaler Hash-Router.
 *
 * Hash-Routing (#/admin) wurde gewählt, weil die App damit ohne Server
 * direkt per Doppelklick auf index.html lauffähig ist. Die gewünschten
 * Pfade entsprechen:
 *   /          -> #/
 *   /form      -> #/form
 *   /admin     -> #/admin
 *   /report/ID -> #/report/ID
 *
 * Bei späterem Backend kann auf History-API-Routing umgestellt werden,
 * ohne die Views zu ändern.
 */
(function (global) {
  'use strict';

  var routes = [];
  var notFoundHandler = null;

  function register(pattern, handler) {
    // pattern z.B. "/report/:id" -> Regex mit benannten Parametern
    var keys = [];
    var regexStr = pattern.replace(/:[^/]+/g, function (m) {
      keys.push(m.slice(1));
      return '([^/]+)';
    });
    routes.push({
      regex: new RegExp('^' + regexStr + '$'),
      keys: keys,
      handler: handler
    });
  }

  function currentPath() {
    var h = global.location.hash || '#/';
    return h.replace(/^#/, '') || '/';
  }

  function resolve() {
    var path = currentPath();
    for (var i = 0; i < routes.length; i++) {
      var m = path.match(routes[i].regex);
      if (m) {
        var params = {};
        routes[i].keys.forEach(function (key, idx) {
          params[key] = decodeURIComponent(m[idx + 1]);
        });
        global.scrollTo(0, 0);
        routes[i].handler(params);
        return;
      }
    }
    // Keine Route passt
    global.scrollTo(0, 0);
    if (notFoundHandler) {
      notFoundHandler({ path: path });
    } else {
      global.location.hash = '#/';
    }
  }

  function navigate(path) {
    global.location.hash = '#' + path;
  }

  global.TDS = global.TDS || {};
  global.TDS.router = {
    register: register,
    navigate: navigate,
    setNotFound: function (handler) { notFoundHandler = handler; },
    start: function () {
      global.addEventListener('hashchange', resolve);
      resolve();
    }
  };
})(window);

  function wireQuickScore() {
    var btn = global.document.getElementById('qs-btn');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var model = (global.document.getElementById('qs-model').value || '').trim();
      var price = parseInt((global.document.getElementById('qs-price').value || '').replace(/[^\d]/g, ''), 10);
      var res = global.document.getElementById('qs-result');
      if (!model || !price) {
        res.innerHTML = '<div class="qs-hint">Bitte Modell und Preis eingeben.</div>';
        return;
      }
      var match = global.TDS.data.market.search(model)[0];
      var values = { land: 'CH', region: 'Zürich', ausweis: 'A (unbeschränkt)', stil: [], modell: model,
        budget_von: price, budget_bis: price, waehrung: 'CHF', paket: 'Quick-Check' };
      var out = scout.generate({ id: 'qs-' + model + '-' + price, values: values });
      var best = out.deals && out.deals[0];
      if (!best) { res.innerHTML = '<div class="qs-hint">Keine Einschätzung möglich.</div>'; return; }
      var col = best.score >= 7.5 ? 'var(--ok)' : best.score >= 5.5 ? 'var(--warn)' : 'var(--err)';
      var gap = best.valueGapPct > 0 ? best.valueGapPct + '% unter Markt'
        : (best.valueGapPct < 0 ? Math.abs(best.valueGapPct) + '% über Markt' : 'am Marktwert');
      res.innerHTML = '<div class="qs-out">' +
        '<div class="qs-badge" style="background:' + col + '">' + best.score.toFixed(1) + '</div>' +
        '<div class="qs-info"><div class="qs-title">' + ui.esc(best.brand + ' ' + best.model) + '</div>' +
          '<div class="qs-sub">Angebot ' + ui.esc(fmt.money(price, 'CHF')) + ' · Marktwert Ø ' +
            ui.esc(fmt.money(best.marketValue, 'CHF')) + ' · ' + ui.esc(gap) + '</div>' +
          (match ? '' : '<div class="qs-hint">Modell nicht im Demo-Katalog — grobe Schätzung.</div>') +
        '</div>' +
        '<a class="btn-primary" href="#/form">Vollständige Analyse →</a>' +
      '</div>';
    });
  }

  // ---- kleine HTML-Helfer ----
  function field(id, label, required, control, errMsg, optTag, extra) {
    return '' +
      '<div class="field">' +
        '<label class="lbl" for="' + id + '">' + ui.esc(label) +
          (required ? ' <span class="req">*</span>' : '') +
          (optTag ? ' <span class="opt">' + ui.esc(optTag) + '</span>' : '') +
        '</label>' +
        control +
        (errMsg ? '<div class="err-msg" id="e-' + id + '">' + ui.esc(errMsg) + '</div>' : '') +
        (extra || '') +
      '</div>';
  }

  function chip(type, name, value, label) {
    var id = name + '-' + value.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    return '' +
      '<div class="chip-wrap">' +
        '<input type="' + type + '" name="' + name + '" id="' + id + '" value="' + ui.esc(value) + '">' +
        '<label for="' + id + '">' + ui.esc(label || value) + '</label>' +
      '</div>';
  }

  // ---- Verhalten ----
  function $(id) { return document.getElementById(id); }

  function fillBudgets(cur) {
    var sep = cur === 'CHF' ? "'" : '.';
    function fmt(n) {
      return cur + ' ' + (n >= 1000 ? Math.floor(n / 1000) + sep + String(n % 1000).padStart(3, '0') : n) + (n === 20000 ? '+' : '');
    }
    var selVon = $('budget-von'), selBis = $('budget-bis');
    var oldVon = selVon.value, oldBis = selBis.value;
    selVon.innerHTML = '<option value="">Von wählen</option>';
    selBis.innerHTML = '<option value="">Bis wählen</option>';
    cfg.BUDGETS.forEach(function (v) {
      var o1 = new Option(fmt(v), v), o2 = new Option(fmt(v), v);
      if (String(v) === oldVon || (!oldVon && v === 4000)) o1.selected = true;
      if (String(v) === oldBis || (!oldBis && v === 8000)) o2.selected = true;
      selVon.add(o1); selBis.add(o2);
    });
  }

  function setCurrency(cur) {
    Array.prototype.forEach.call(document.querySelectorAll('.pkg-cur'), function (el, i) {
      el.textContent = cur + ' ';
      // Preis je nach Währung (hier identisch, aber vorbereitet)
      var span = el.nextElementSibling;
      if (span && cfg.PACKAGES[i]) span.textContent = cfg.PACKAGES[i].price[cur] || cfg.PACKAGES[i].price.CHF;
    });
    var land = $('land').value;
    $('payment-hint').textContent = (land && cfg.REGIONS[land]) ? cfg.REGIONS[land].payment : 'Zahlungslink';
    fillBudgets(cur);
  }

  function clearErr(id) {
    var el = $('e-' + id); if (el) el.classList.remove('show');
    var inp = $(id); if (inp) inp.classList.remove('err');
  }

  function liveCheckBudget() {
    var vonSel = $('budget-von'), bisSel = $('budget-bis');
    var von = parseInt(vonSel.value) || 0;
    var bis = parseInt(bisSel.value) || 0;
    if (von && bis && von >= bis) {
      // Sanfte Autokorrektur: nächsthöhere "Bis"-Option wählen
      var fixed = null;
      Array.prototype.forEach.call(bisSel.options, function (o) {
        var ov = parseInt(o.value) || 0;
        if (fixed === null && ov > von) fixed = o.value;
      });
      if (fixed !== null) { bisSel.value = fixed; clearErr('budget'); }
      else { $('e-budget').textContent = '"Von" muss kleiner sein als "Bis".'; $('e-budget').classList.add('show'); }
    } else {
      clearErr('budget');
    }
  }

  function validate() {
    var errs = [];
    function check(pass, errId, inputId, msg, label) {
      var errEl = $(errId), inp = $(inputId);
      if (!pass) {
        if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); }
        if (inp) { inp.classList.add('err'); inp.setAttribute('aria-invalid', 'true'); }
        errs.push({ id: inputId, label: label || msg });
      } else {
        if (errEl) errEl.classList.remove('show');
        if (inp) { inp.classList.remove('err'); inp.removeAttribute('aria-invalid'); }
      }
    }

    check($('vorname').value.trim() !== '', 'e-vorname', 'vorname', 'Bitte Vorname eingeben.', 'Vorname');
    check($('nachname').value.trim() !== '', 'e-nachname', 'nachname', 'Bitte Nachname eingeben.', 'Nachname');
    check(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim()), 'e-email', 'email', 'Bitte eine gültige E-Mail-Adresse eingeben.', 'E-Mail');
    check($('land').value !== '', 'e-land', 'land', 'Bitte Land auswählen.', 'Land');
    check($('region').value !== '', 'e-region', 'region', 'Bitte Region auswählen.', 'Region');

    chipsGroup('ausweis', 'e-ausweis', 'chips-ausweis', 'Bitte Führerausweis auswählen.', 'Führerausweis', errs);
    chipsGroup('stil', 'e-stil', 'chips-stil', 'Bitte mindestens einen Stil auswählen.', 'Stil', errs);

    var von = parseInt($('budget-von').value) || 0;
    var bis = parseInt($('budget-bis').value) || 0;
    if (!von || !bis) {
      setErr('e-budget', 'budget-von', 'Bitte Budget Von und Bis auswählen.'); errs.push({ id: 'budget-von', label: 'Budget' });
    } else if (von >= bis) {
      setErr('e-budget', 'budget-von', '"Von" muss kleiner sein als "Bis".'); errs.push({ id: 'budget-von', label: 'Budget' });
    } else { clearErr('budget'); $('budget-von').classList.remove('err'); }

    if (!document.querySelector('input[name="paket"]:checked')) {
      $('e-paket').classList.add('show'); errs.push({ id: 'pkg-Quick-Check', label: 'Paket' });
    } else { $('e-paket').classList.remove('show'); }

    var dsg = $('dsg');
    if (!dsg || !dsg.checked) {
      $('e-dsg').classList.add('show');
      if (dsg) dsg.setAttribute('aria-invalid', 'true');
      errs.push({ id: 'dsg', label: 'Datenschutz' });
    } else { $('e-dsg').classList.remove('show'); dsg.removeAttribute('aria-invalid'); }

    if (errs.length > 0) { showErrorSummary(errs); return false; }
    clearErrorSummary();
    return true;
  }

  /** Barrierefreie Fehler-Zusammenfassung oben im Formular. */
  function showErrorSummary(errs) {
    var box = $('form-errors');
    if (!box) return;
    var links = errs.map(function (e) {
      return '<li><a href="#' + e.id + '" data-target="' + e.id + '">' + ui.esc(e.label) + '</a></li>';
    }).join('');
    box.innerHTML = '<strong>Bitte korrigiere ' + errs.length + (errs.length === 1 ? ' Angabe' : ' Angaben') + ':</strong>' +
      '<ul>' + links + '</ul>';
    box.hidden = false;
    box.focus();
  }

  function clearErrorSummary() {
    var box = $('form-errors');
    if (box) { box.hidden = true; box.innerHTML = ''; }
  }

  function setErr(errId, inputId, msg) {
    var errEl = $(errId), inp = $(inputId);
    if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); }
    if (inp) inp.classList.add('err');
  }

  function chipsGroup(name, errId, wrapId, msg, label, errs) {
    var ok = document.querySelector('input[name="' + name + '"]:checked') !== null;
    var errEl = $(errId), wrap = $(wrapId);
    if (!ok) {
      if (errEl) { errEl.textContent = msg; errEl.classList.add('show'); }
      if (wrap) { wrap.classList.add('err-chips'); wrap.setAttribute('aria-invalid', 'true'); }
      errs.push({ id: wrapId, label: label });
    } else {
      if (errEl) errEl.classList.remove('show');
      if (wrap) { wrap.classList.remove('err-chips'); wrap.removeAttribute('aria-invalid'); }
    }
  }

  /** Formularwerte einsammeln -> flaches Objekt für den Store. */
  function collect() {
    var stile = [];
    document.querySelectorAll('input[name="stil"]:checked').forEach(function (el) { stile.push(el.value); });
    function radio(name) {
      var el = document.querySelector('input[name="' + name + '"]:checked');
      return el ? el.value : '';
    }
    var land = $('land').value;
    return {
      vorname: $('vorname').value.trim(),
      nachname: $('nachname').value.trim(),
      email: $('email').value.trim(),
      telefon: $('telefon').value.trim(),
      land: land,
      landLabel: ({ CH: 'Schweiz', DE: 'Deutschland', AT: 'Österreich', LI: 'Liechtenstein' })[land] || land,
      region: $('region').value,
      ausweis: radio('ausweis'),
      erfahrung: radio('erfahrung'),
      stil: stile,
      modell: $('modell').value.trim(),
      budget_von: $('budget-von').value,
      budget_bis: $('budget-bis').value,
      waehrung: cfg.currencyFor(land),
      baujahr: $('baujahr').value,
      km: $('km').value,
      nutzung: radio('nutzung'),
      prioritaeten: $('prioritaeten').value.trim(),
      paket: radio('paket')
    };
  }

  /* ---------- Entwurf (Autosave/Resume) ---------- */
  var DRAFT_KEY = 'tds_draft_v1';
  var draftTimer = null;

  function serializeDraft() {
    var vals = {};
    ['vorname', 'nachname', 'email', 'telefon', 'land', 'region', 'modell',
      'prioritaeten', 'baujahr', 'km', 'budget-von', 'budget-bis'].forEach(function (id) {
      var el = $(id); if (el) vals[id] = el.value;
    });
    var radios = {};
    ['ausweis', 'erfahrung', 'nutzung', 'paket'].forEach(function (name) {
      var el = document.querySelector('input[name="' + name + '"]:checked');
      radios[name] = el ? el.value : '';
    });
    var stil = [];
    document.querySelectorAll('input[name="stil"]:checked').forEach(function (el) { stil.push(el.value); });
    return { vals: vals, radios: radios, stil: stil };
  }

  function draftHasContent(d) {
    return !!(d && d.vals && (d.vals.vorname || d.vals.nachname || d.vals.email || d.vals.modell || (d.stil && d.stil.length)));
  }

  function saveDraft() {
    try {
      var d = serializeDraft();
      if (draftHasContent(d)) {
        global.localStorage.setItem(DRAFT_KEY, JSON.stringify({ at: new Date().toISOString(), data: d }));
      }
    } catch (e) {}
  }

  function loadDraft() {
    try { return JSON.parse(global.localStorage.getItem(DRAFT_KEY) || 'null'); }
    catch (e) { return null; }
  }

  function clearDraft() {
    try { global.localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  }

  function pick(name, value) {
    if (!value) return;
    var el = document.querySelector('input[name="' + name + '"][value="' + value.replace(/"/g, '\\"') + '"]');
    if (el) el.checked = true;
  }

  function applyDraft(d) {
    var v = d.vals || {};
    ['vorname', 'nachname', 'email', 'telefon', 'modell', 'prioritaeten'].forEach(function (id) {
      if ($(id) && v[id] != null) $(id).value = v[id];
    });
    if (v.land) { $('land').value = v.land; $('land').dispatchEvent(new Event('change')); }
    if (v.region && $('region')) $('region').value = v.region;
    if (v['budget-von']) $('budget-von').value = v['budget-von'];
    if (v['budget-bis']) $('budget-bis').value = v['budget-bis'];
    if (v.baujahr && $('baujahr')) $('baujahr').value = v.baujahr;
    if (v.km && $('km')) $('km').value = v.km;
    Object.keys(d.radios || {}).forEach(function (name) { pick(name, d.radios[name]); });
    (d.stil || []).forEach(function (val) { pick('stil', val); });
  }

  function showDraftBanner() {
    var draft = loadDraft();
    if (!draft || !draftHasContent(draft.data)) return;
    var banner = $('draft-banner');
    if (!banner) return;
    banner.innerHTML = '<div class="draft-bar">' +
      '<span>📝 Nicht abgeschickter Entwurf von <strong>' + ui.esc(ui.fmt.relative(draft.at)) + '</strong> gefunden.</span>' +
      '<span class="draft-actions">' +
        '<button type="button" class="btn-mini" id="draft-restore">Wiederherstellen</button>' +
        '<button type="button" class="btn-mini ghost" id="draft-discard">Verwerfen</button>' +
      '</span></div>';
    $('draft-restore').addEventListener('click', function () {
      applyDraft(draft.data); banner.innerHTML = '';
      updateProgress();
      if (global.TDS.toast) global.TDS.toast.info('Entwurf wiederhergestellt');
    });
    $('draft-discard').addEventListener('click', function () {
      clearDraft(); banner.innerHTML = '';
    });
  }

  function progressState() {
    var checks = [
      $('vorname').value.trim() !== '',
      $('nachname').value.trim() !== '',
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test($('email').value.trim()),
      $('land').value !== '',
      $('region').value !== '',
      !!document.querySelector('input[name="ausweis"]:checked'),
      !!document.querySelector('input[name="stil"]:checked'),
      !!($('budget-von').value && $('budget-bis').value),
      !!document.querySelector('input[name="paket"]:checked')
    ];
    var done = checks.filter(Boolean).length;
    return { done: done, total: checks.length, pct: Math.round(done / checks.length * 100) };
  }

  function updateProgress() {
    var p = progressState();
    var fill = $('fp-fill'); if (fill) fill.style.width = p.pct + '%';
    var label = $('fp-label'); if (label) label.textContent = p.pct + ' % ausgefüllt' + (p.pct === 100 ? ' — bereit zum Absenden ✓' : '');
  }

  /* ---------- Letzten Standort merken (Komfort) ---------- */
  var LOC_KEY = 'tds_last_loc';
  function saveLastLocation(land, region) {
    try { global.localStorage.setItem(LOC_KEY, JSON.stringify({ land: land, region: region })); } catch (e) {}
  }
  function applyLastLocation() {
    if ($('land').value) return;
    var loc;
    try { loc = JSON.parse(global.localStorage.getItem(LOC_KEY) || 'null'); } catch (e) { loc = null; }
    if (!loc || !loc.land) return;
    $('land').value = loc.land;
    $('land').dispatchEvent(new Event('change'));
    if (loc.region && $('region')) $('region').value = loc.region;
  }

  function wire() {
    fillBudgets('CHF');
    showDraftBanner();
    updateProgress();

    // Autosave + Fortschritt bei jeder Eingabe
    $('frm').addEventListener('input', function () { saveDraft(); updateProgress(); });
    $('frm').addEventListener('change', function () { saveDraft(); updateProgress(); });

    // Zusätzliches Intervall-Autosave (alle 30 s); altes Intervall vermeiden.
    if (draftTimer) clearInterval(draftTimer);
    draftTimer = setInterval(saveDraft, 30000);

    // Fehler-Zusammenfassung: Klick springt zum Feld
    $('form-errors').addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[data-target]');
      if (!a) return;
      e.preventDefault();
      var t = $(a.getAttribute('data-target'));
      if (t) { if (t.focus) t.focus(); if (t.scrollIntoView) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    });

    $('land').addEventListener('change', function () {
      var land = this.value;
      var sel = $('region'), hint = $('quellen-hint');
      sel.innerHTML = '';
      if (!land) {
        sel.add(new Option('Zuerst Land wählen', ''));
        hint.textContent = '';
        setCurrency('CHF');
        $('payment-hint').textContent = 'Zahlungslink';
        return;
      }
      var d = cfg.REGIONS[land];
      sel.add(new Option('Bitte ' + d.label + ' wählen', ''));
      d.opts.forEach(function (o) { sel.add(new Option(o, o)); });
      hint.textContent = d.hint;
      setCurrency(d.cur);
      clearErr('land');
    });

    $('region').addEventListener('change', function () { if (this.value) clearErr('region'); });
    $('budget-von').addEventListener('change', liveCheckBudget);
    $('budget-bis').addEventListener('change', liveCheckBudget);

    // Komfort: zuletzt genutztes Land/Region vorbelegen (nur ohne Entwurf)
    if (!loadDraft()) { applyLastLocation(); updateProgress(); }

    $('frm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!validate()) return;

      var btn = $('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Wird gespeichert …';

      var values = collect();
      saveLastLocation(values.land, values.region);
      store.create(values).then(function (record) {
        clearDraft();
        if (global.TDS.toast) global.TDS.toast.success('Anfrage gespeichert');
        router.navigate('/success/' + record.id);
      }).catch(function (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Anfrage absenden →';
        if (global.TDS.toast) global.TDS.toast.error('Speichern fehlgeschlagen. Bitte erneut versuchen.');
      });
    });
  }

  global.TDS = global.TDS || {};
  global.TDS.views = global.TDS.views || {};
  global.TDS.views.form = view;
})(window);

              '<div><span>Status</span>' + ui.statusBadge(rec.status) + '</div>' +
            '</div>' +
            '<div class="success-actions">' +
              '<a class="btn-primary" href="#/report/' + ui.esc(rec.id) + '">Beispiel-Report ansehen →</a>' +
              '<button class="btn-ghost" id="copy-ref" type="button">Anfrage-Nr. kopieren</button>' +
              '<a class="btn-ghost" href="#/">Zur Startseite</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '';

      ui.render(html);

      var copyBtn = global.document.getElementById('copy-ref');
      if (copyBtn) copyBtn.addEventListener('click', function () {
        var done = function () { if (global.TDS.toast) global.TDS.toast.success('Anfrage-Nr. kopiert: ' + rec.id); };
        if (global.navigator && global.navigator.clipboard) {
          global.navigator.clipboard.writeText(rec.id).then(done, done);
        } else { done(); }
      });
    });
  }

  global.TDS = global.TDS || {};
  global.TDS.views = global.TDS.views || {};
  global.TDS.views.success = view;
})(window);

/* ===== js/components/admin.js ===== */
/*
 * components/admin.js — Admin-Bereich.
 *   #/admin       -> Dashboard (KPIs + Charts) + durchsuchbare Liste
 *   #/admin/:id   -> Detailansicht: Stammdaten, Status, Notizen, Historie
 *
 * Hinweis: Kein Login (MVP). Auth-Guard-Stelle ist in app.js markiert.
 */
(function (global) {
  'use strict';

  var ui = global.TDS.ui;
  var cfg = global.TDS.config;
  var store = global.TDS.store;
  var router = global.TDS.router;
  var charts = global.TDS.charts;
  var fmt = global.TDS.format;
  var toast = global.TDS.toast;

  // Tabellenzustand (in-memory, persistiert über Sitzungen)
  var PAGE = 8;
  var SKEY = 'tds_admin_state';
  var state = { q: '', status: 'Alle', sort: 'date-desc', limit: PAGE };
  var allRows = [];

  function $(id) { return global.document.getElementById(id); }

  function loadState() {
    try {
      var s = JSON.parse(global.localStorage.getItem(SKEY) || 'null');
      if (s) { state.q = s.q || ''; state.status = s.status || 'Alle'; state.sort = s.sort || 'date-desc'; }
    } catch (e) {}
    state.limit = PAGE;
  }
  function saveState() {
    try { global.localStorage.setItem(SKEY, JSON.stringify({ q: state.q, status: state.status, sort: state.sort })); } catch (e) {}
  }

  /* ============== LISTE / DASHBOARD ============== */
  function list() {
    loadState();
    Promise.all([store.list(), store.stats()]).then(function (res) {
      allRows = res[0];
      var stats = res[1];

      var html = '' +
        '<div class="admin-bar">' +
          '<div class="admin-bar-inner">' +
            '<div><h2 class="admin-title">Dashboard</h2>' +
            '<div class="admin-sub">' + stats.total + ' Anfragen · lokal gespeichert</div></div>' +
            '<a class="btn-primary btn-sm" href="#/form">+ Neue Anfrage</a>' +
          '</div>' +
        '</div>' +

        '<div class="wrap wrap-wide">' +
          dashboardHtml(stats) +

          '<div class="toolbar">' +
            '<input type="search" id="search" class="search-input" placeholder="Suche: Name, E-Mail, Modell, ID …" value="' + ui.esc(state.q) + '">' +
            '<div class="sel-wrap toolbar-sort"><select id="sort">' +
              sortOpt('date-desc', 'Neueste zuerst') + sortOpt('date-asc', 'Älteste zuerst') +
              sortOpt('name-asc', 'Name A–Z') + sortOpt('status-asc', 'Status') +
            '</select></div>' +
          '</div>' +

          '<div class="filters" id="filters">' + filterBtns(stats) + '</div>' +

          '<div class="table-card">' +
            '<table class="tbl"><thead><tr>' +
              '<th scope="col">ID</th>' +
              th('Datum', 'date') + th('Name', 'name') +
              '<th scope="col">Region</th><th scope="col">Wunsch</th><th scope="col">Paket</th>' +
              th('Status', 'status') +
            '</tr></thead><tbody id="tbody"></tbody></table>' +
            '<div class="table-more" id="table-more"></div>' +
          '</div>' +

          '<div class="admin-tools">' +
            '<button class="btn-ghost btn-sm" id="seed-btn">Beispieldaten laden</button>' +
            '<button class="btn-ghost btn-sm" id="csv-btn">CSV exportieren</button>' +
            '<button class="btn-ghost btn-sm" id="json-btn">JSON exportieren</button>' +
            '<button class="btn-ghost btn-sm" id="import-btn">JSON importieren</button>' +
            '<button class="btn-ghost btn-sm danger" id="clear-btn">Alle löschen</button>' +
            '<input type="file" id="import-file" accept="application/json,.json" hidden>' +
          '</div>' +
        '</div>' +
        '';

      ui.render(html);
      refreshTable();
      wireList();
    });
  }

  function dashboardHtml(s) {
    var segments = cfg.STATUSES.map(function (st) {
      return { label: st, value: s.byStatus[st] || 0, color: cfg.STATUS_COLORS[st] };
    });
    var legend = segments.map(function (seg) {
      return '<div class="legend-row"><span class="legend-dot" style="background:' + seg.color + '"></span>' +
        ui.esc(seg.label) + '<span class="legend-val">' + seg.value + '</span></div>';
    }).join('');

    var pkgBars = Object.keys(s.byPackage).map(function (k) {
      return { label: k, value: s.byPackage[k] };
    });
    var countryBars = Object.keys(s.byCountry).map(function (k) {
      return { label: k, value: s.byCountry[k] };
    }).sort(function (a, b) { return b.value - a.value; });

    return '<div class="dash-grid">' +
        kpi('Anfragen gesamt', s.total, '') +
        kpi('Neu (7 Tage)', s.last7, 'frisch') +
        kpi('Offen', s.open, 'in Bearbeitung') +
        kpi('Conversion', fmt.pct(s.conversion), 'Report/abgeschlossen') +
        kpi('Ø Budget', fmt.money(s.avgBudget, 'CHF'), 'Mittelwert') +
      '</div>' +
      '<div class="dash-charts">' +
        '<div class="chart-card">' +
          '<div class="chart-card-head">Status-Verteilung</div>' +
          '<div class="donut-wrap">' +
            charts.donut(segments, { center: s.total, centerSub: 'Anfragen' }) +
            '<div class="legend">' + legend + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="chart-card">' +
          '<div class="chart-card-head">Pakete</div>' +
          (pkgBars.length ? charts.bars(pkgBars) : '<div class="muted-cell">Noch keine Daten.</div>') +
        '</div>' +
      '</div>' +
      '<div class="dash-charts">' +
        '<div class="chart-card">' +
          '<div class="chart-card-head">Länder</div>' +
          (countryBars.length ? charts.bars(countryBars) : '<div class="muted-cell">Noch keine Daten.</div>') +
        '</div>' +
        '<div class="chart-card">' +
          '<div class="chart-card-head">Letzte Aktivität</div>' +
          recentHtml() +
        '</div>' +
      '</div>';
  }

  function recentHtml() {
    if (!allRows.length) return '<div class="muted-cell">Noch keine Anfragen.</div>';
    return '<div class="recent-list">' + allRows.slice(0, 5).map(function (r) {
      var v = r.values;
      return '<a class="recent-item" href="#/admin/' + ui.esc(r.id) + '">' +
        '<span class="recent-name">' + ui.esc(v.vorname + ' ' + v.nachname) + '</span>' +
        ui.statusBadge(r.status) +
        '<span class="recent-time">' + ui.esc(fmt.relative(r.updatedAt || r.createdAt)) + '</span>' +
        '</a>';
    }).join('') + '</div>';
  }

  function kpi(label, value, sub) {
    var valHtml = (typeof value === 'number')
      ? '<div class="kpi-val" data-count="' + value + '">0</div>'
      : '<div class="kpi-val">' + ui.esc(value) + '</div>';
    return '<div class="kpi">' + valHtml +
      '<div class="kpi-label">' + ui.esc(label) + '</div>' +
      (sub ? '<div class="kpi-sub">' + ui.esc(sub) + '</div>' : '') + '</div>';
  }

  function sortOpt(val, label) {
    return '<option value="' + val + '"' + (state.sort === val ? ' selected' : '') + '>' + ui.esc(label) + '</option>';
  }

  // Sortierbarer Spaltenkopf (klickbar, mit aria-sort)
  function th(label, key) {
    var parts = state.sort.split('-'), active = parts[0] === key;
    var aria = active ? (parts[1] === 'asc' ? 'ascending' : 'descending') : 'none';
    var arrow = active ? (parts[1] === 'asc' ? ' ▲' : ' ▼') : '';
    return '<th scope="col" class="th-sort' + (active ? ' active' : '') + '" data-key="' + key + '" aria-sort="' + aria + '" tabindex="0" role="button">' +
      ui.esc(label) + '<span class="th-arrow">' + arrow + '</span></th>';
  }

  // Spaltenkopf-Klick: gleiche Spalte -> Richtung wechseln, sonst aufsteigend.
  function setSort(key) {
    var parts = state.sort.split('-');
    var dir = (parts[0] === key && parts[1] === 'asc') ? 'desc' : 'asc';
    state.sort = key + '-' + dir;
    state.limit = PAGE;
    saveState();
    var sel = $('sort'); if (sel) sel.value = state.sort; // falls Option existiert
    syncSortHeaders();
    refreshTable();
  }

  // aria-sort / Pfeile an den aktuellen state.sort angleichen.
  function syncSortHeaders() {
    var parts = state.sort.split('-'), key = parts[0], dir = parts[1];
    Array.prototype.forEach.call(global.document.querySelectorAll('.th-sort'), function (el) {
      var on = el.getAttribute('data-key') === key;
      el.classList.toggle('active', on);
      el.setAttribute('aria-sort', on ? (dir === 'asc' ? 'ascending' : 'descending') : 'none');
      var a = el.querySelector('.th-arrow'); if (a) a.textContent = on ? (dir === 'asc' ? ' ▲' : ' ▼') : '';
    });
  }

  function filterBtns(stats) {
    var counts = { Alle: stats.total };
    cfg.STATUSES.forEach(function (s) { counts[s] = stats.byStatus[s] || 0; });
    return ['Alle'].concat(cfg.STATUSES).map(function (s) {
      return '<button class="filter-btn' + (state.status === s ? ' active' : '') +
        '" data-filter="' + ui.esc(s) + '">' + ui.esc(s) +
        ' <span class="filter-count">' + (counts[s] || 0) + '</span></button>';
    }).join('');
  }

  function applyFilters() {
    var rows = allRows.slice();
    if (state.status !== 'Alle') rows = rows.filter(function (r) { return r.status === state.status; });
    if (state.q) {
      var q = state.q.toLowerCase();
      rows = rows.filter(function (r) {
        var v = r.values;
        return [r.id, v.vorname, v.nachname, v.email, v.modell, v.region, v.paket,
          (Array.isArray(v.stil) ? v.stil.join(' ') : v.stil)].join(' ').toLowerCase().indexOf(q) !== -1;
      });
    }
    var parts = state.sort.split('-'), key = parts[0], dir = parts[1] === 'desc' ? -1 : 1;
    rows.sort(function (a, b) {
      var r;
      if (key === 'name') r = (a.values.nachname || '').localeCompare(b.values.nachname || '');
      else if (key === 'status') r = cfg.STATUSES.indexOf(a.status) - cfg.STATUSES.indexOf(b.status);
      else r = new Date(a.createdAt) - new Date(b.createdAt);
      return r * dir;
    });
    return rows;
  }

  function refreshTable() {
    var rows = applyFilters();
    var tbody = $('tbody');
    var more = $('table-more');
    if (more) more.innerHTML = '';
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-row">Keine Treffer. ' +
        '<a href="#/form">Neue Anfrage erstellen →</a></td></tr>';
      return;
    }
    var shown = rows.slice(0, state.limit);
    tbody.innerHTML = shown.map(rowHtml).join('');
    if (more && rows.length > state.limit) {
      more.innerHTML = '<button class="btn-ghost btn-sm" id="more-btn">Weitere ' +
        Math.min(PAGE, rows.length - state.limit) + ' von ' + rows.length + ' anzeigen</button>';
      $('more-btn').addEventListener('click', function () { state.limit += PAGE; refreshTable(); });
    }
    // Klicks werden delegiert (siehe wireList) — kein Listener pro Zeile.
  }

  function rowHtml(r) {
    var v = r.values;
    var wunsch = v.modell ? v.modell : (Array.isArray(v.stil) ? v.stil.join(', ') : v.stil || '–');
    return '<tr data-id="' + ui.esc(r.id) + '">' +
      '<td class="mono">' + ui.esc(r.id) + '</td>' +
      '<td>' + ui.esc(fmt.dateShort(r.createdAt)) + '</td>' +
      '<td>' + ui.esc(v.vorname + ' ' + v.nachname) + '</td>' +
      '<td class="muted-cell">' + ui.esc(v.region || '–') + '</td>' +
      '<td class="muted-cell">' + ui.esc(wunsch) + '</td>' +
      '<td>' + ui.esc(v.paket || '–') + '</td>' +
      '<td>' + ui.statusBadge(r.status) + '</td>' +
      '</tr>';
  }

  function wireList() {
    var search = $('search');
    search.addEventListener('input', global.TDS.dom.debounce(function () { state.q = search.value; state.limit = PAGE; saveState(); refreshTable(); }, 140));
    $('sort').addEventListener('change', function () { state.sort = this.value; state.limit = PAGE; saveState(); syncSortHeaders(); refreshTable(); });

    // Sortierbare Spaltenköpfe (Klick + Tastatur)
    Array.prototype.forEach.call(global.document.querySelectorAll('.th-sort'), function (el) {
      el.addEventListener('click', function () { setSort(this.getAttribute('data-key')); });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSort(this.getAttribute('data-key')); }
      });
    });

    // Ein delegierter Klick-Listener für alle (auch künftige) Tabellenzeilen.
    $('tbody').addEventListener('click', function (e) {
      var tr = e.target.closest && e.target.closest('tr[data-id]');
      if (tr) router.navigate('/admin/' + tr.getAttribute('data-id'));
    });

    Array.prototype.forEach.call(global.document.querySelectorAll('.filter-btn'), function (btn) {
      btn.addEventListener('click', function () {
        state.status = this.getAttribute('data-filter');
        state.limit = PAGE;
        saveState();
        Array.prototype.forEach.call(global.document.querySelectorAll('.filter-btn'), function (b) {
          b.classList.toggle('active', b === btn);
        });
        refreshTable();
      });
    });

    $('seed-btn').addEventListener('click', function () {
      seedDemo().then(function () { toast.success('Beispieldaten geladen'); list(); });
    });
    $('csv-btn').addEventListener('click', exportCsv);
    $('json-btn').addEventListener('click', function () {
      store.exportJSON().then(function (json) {
        global.TDS.dom.download('toeffdealscout-export.json', json, 'application/json');
        toast.success('JSON exportiert');
      });
    });
    $('import-btn').addEventListener('click', function () { $('import-file').click(); });
    $('import-file').addEventListener('change', function (e) {
      var file = e.target.files[0]; if (!file) return;
      var reader = new global.FileReader();
      reader.onload = function () {
        store.importJSON(reader.result, 'merge').then(function (r) {
          toast.success('Import: ' + r.imported + ' neu, ' + r.skipped + ' übersprungen');
          list();
        }).catch(function () { toast.error('Import fehlgeschlagen — ungültige Datei.'); });
      };
      reader.readAsText(file);
    });
    $('clear-btn').addEventListener('click', function () {
      if (global.confirm('Wirklich ALLE Anfragen löschen?')) {
        store.clear().then(function (prev) {
          state.status = 'Alle'; state.q = '';
          toast.info((prev.length) + ' Anfragen gelöscht', { action: { label: 'Rückgängig', fn: function () {
            store.restoreMany(prev).then(function () { toast.success('Wiederhergestellt'); list(); });
          } } });
          list();
        });
      }
    });
  }

  /* ============== DETAIL ============== */
  function detail(params) {
    store.get(params.id).then(function (rec) {
      if (!rec) return notFound();
      var v = rec.values;

      var statusOpts = cfg.STATUSES.map(function (s) {
        return '<option value="' + ui.esc(s) + '"' + (s === rec.status ? ' selected' : '') + '>' + ui.esc(s) + '</option>';
      }).join('');
      var nextStatus = cfg.STATUSES[cfg.STATUSES.indexOf(rec.status) + 1] || null;

      var html = '' +
        '<div class="admin-bar"><div class="admin-bar-inner">' +
          '<div><a class="back-link" href="#/admin">← Dashboard</a>' +
            '<h2 class="admin-title">' + ui.esc(v.vorname + ' ' + v.nachname) + '</h2>' +
            '<div class="admin-sub mono">' + ui.esc(rec.id) + ' · ' + ui.esc(fmt.date(rec.createdAt)) + '</div></div>' +
          '<a class="btn-primary btn-sm" href="#/report/' + ui.esc(rec.id) + '">Report ansehen →</a>' +
        '</div></div>' +

        '<div class="wrap wrap-wide"><div class="detail-grid">' +
          '<div class="detail-main">' +
            dataBlock('Kontakt', [
              ['Vorname', v.vorname], ['Nachname', v.nachname], ['E-Mail', v.email],
              ['Telefon', v.telefon || '–'], ['Land', v.landLabel || v.land], ['Region', v.region]
            ]) +
            dataBlock('Führerausweis & Erfahrung', [
              ['Führerausweis', v.ausweis], ['Erfahrung', v.erfahrung || '–']
            ]) +
            dataBlock('Wunsch-Motorrad', [
              ['Stil', Array.isArray(v.stil) ? v.stil.join(', ') : v.stil],
              ['Modell', v.modell || '–'], ['Budget', budgetText(v)],
              ['Baujahr ab', v.baujahr || '–'], ['Max. km', v.km || '–'],
              ['Nutzung', v.nutzung || '–'], ['Prioritäten', v.prioritaeten || '–']
            ]) +
            notesBlock(rec) +
          '</div>' +

          '<aside class="detail-side">' +
            '<div class="side-card">' +
              '<div class="side-card-head">Status</div>' +
              '<div class="current-status">' + ui.statusBadge(rec.status) + '</div>' +
              '<div class="sel-wrap"><select id="status-sel">' + statusOpts + '</select></div>' +
              (nextStatus ? '<button class="btn-ghost btn-sm btn-block" id="advance-btn" style="margin-top:8px">Weiter zu „' + ui.esc(nextStatus) + '" →</button>' : '') +
              '<div class="side-saved" id="status-saved">✓ Gespeichert</div>' +
            '</div>' +
            '<div class="side-card">' +
              '<div class="side-card-head">Paket</div>' +
              '<div class="side-pkg">' + ui.esc(v.paket || '–') + '</div>' +
            '</div>' +
            historyBlock(rec) +
            '<div class="side-card">' +
              '<div class="side-card-head">Aktionen</div>' +
              '<a class="btn-ghost btn-block" href="#/report/' + ui.esc(rec.id) + '">Report-Mockup öffnen</a>' +
              '<a class="btn-ghost btn-block" href="mailto:' + ui.esc(v.email) + '">E-Mail an Kunde</a>' +
              '<button class="btn-ghost btn-block danger" id="del-btn">Anfrage löschen</button>' +
            '</div>' +
          '</aside>' +
        '</div></div>' +
        '';

      ui.render(html);
      wireDetail(rec);
    });
  }

  function notesBlock(rec) {
    var items = (rec.notes || []).slice().reverse().map(function (n) {
      return '<div class="note-item"><div class="note-meta">' + ui.esc(fmt.relative(n.at)) + '</div>' +
        '<div class="note-text">' + ui.esc(n.text) + '</div></div>';
    }).join('');
    return '<div class="data-block">' +
      '<div class="data-block-head">Interne Notizen</div>' +
      '<div class="note-add">' +
        '<textarea id="note-input" placeholder="Notiz hinzufügen (nur intern sichtbar) …"></textarea>' +
        '<button class="btn-ghost btn-sm" id="note-btn">Notiz speichern</button>' +
      '</div>' +
      '<div class="note-list">' + (items || '<div class="muted-cell">Noch keine Notizen.</div>') + '</div>' +
      '</div>';
  }

  function historyBlock(rec) {
    var items = (rec.history || []).slice().reverse().map(function (h) {
      return '<div class="tl-item"><span class="tl-dot" style="background:' + (cfg.STATUS_COLORS[h.status] || 'var(--accent)') + '"></span>' +
        '<div><div class="tl-status">' + ui.esc(h.status) + '</div>' +
        '<div class="tl-time">' + ui.esc(fmt.date(h.at)) + '</div></div></div>';
    }).join('');
    return '<div class="side-card"><div class="side-card-head">Verlauf</div>' +
      '<div class="timeline">' + items + '</div></div>';
  }

  function wireDetail(rec) {
    var sel = $('status-sel');
    sel.addEventListener('change', function () {
      store.updateStatus(rec.id, this.value).then(function () {
        var cur = global.document.querySelector('.current-status');
        if (cur) cur.innerHTML = ui.statusBadge(sel.value);
        var saved = $('status-saved');
        saved.classList.add('show');
        setTimeout(function () { saved.classList.remove('show'); }, 1600);
        if (toast) toast.success('Status: ' + sel.value);
        detail({ id: rec.id }); // Verlauf aktualisieren
      });
    });
    var adv = $('advance-btn');
    if (adv) adv.addEventListener('click', function () {
      var next = cfg.STATUSES[cfg.STATUSES.indexOf(rec.status) + 1];
      if (!next) return;
      store.updateStatus(rec.id, next).then(function () {
        if (toast) toast.success('Status: ' + next);
        detail({ id: rec.id });
      });
    });
    $('note-btn').addEventListener('click', function () {
      var input = $('note-input');
      var text = (input.value || '').trim();
      if (!text) { input.focus(); return; }
      store.addNote(rec.id, text).then(function () {
        if (toast) toast.success('Notiz gespeichert');
        detail({ id: rec.id });
      });
    });
    $('del-btn').addEventListener('click', function () {
      if (global.confirm('Diese Anfrage wirklich löschen?')) {
        store.remove(rec.id).then(function (removed) {
          if (toast) toast.info('Anfrage gelöscht', { action: { label: 'Rückgängig', fn: function () {
            store.restore(removed).then(function () { toast.success('Wiederhergestellt'); detail({ id: removed.id }); });
          } } });
          router.navigate('/admin');
        });
      }
    });
  }

  /* ============== Helfer ============== */
  function notFound() {
    ui.render('' + '<div class="wrap"><div class="sec"><p>Anfrage nicht gefunden.</p>' +
      '<a class="btn-ghost" href="#/admin">← Zurück</a></div></div>' + '');
  }

  function budgetText(v) {
    if (!v.budget_von && !v.budget_bis) return '–';
    var cur = v.waehrung || 'CHF';
    return fmt.money(v.budget_von, cur) + ' – ' + fmt.money(v.budget_bis, cur);
  }

  function dataBlock(title, pairs) {
    var rows = pairs.map(function (p) {
      return '<div class="dl-row"><dt>' + ui.esc(p[0]) + '</dt><dd>' + ui.esc(p[1]) + '</dd></div>';
    }).join('');

    if (now - lastErrToast < 4000) return;
    lastErrToast = now;
    if (TDS.toast) TDS.toast.error('Etwas ist schiefgelaufen — bitte erneut versuchen.');
  }
  global.addEventListener('error', reportError);
  global.addEventListener('unhandledrejection', reportError);

  router.start();

  // Verdichtende, "schwebende" Kopfzeile beim Scrollen.
  var rafPending = false;
  var onScroll = function () {
    var y = global.scrollY || global.pageYOffset || 0;
    global.document.documentElement.classList.toggle('is-scrolled', y > 8);
    // Parallax-Wert nur einmal pro Frame setzen (RAF-Debounce, weniger Recalcs).
    if (!rafPending) {
      rafPending = true;
      global.requestAnimationFrame(function () {
        global.document.documentElement.style.setProperty('--sy', y);
        rafPending = false;
      });
    }
  };
  global.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Tastatur-Shortcuts: "/" fokussiert die Admin-Suche, "n" startet eine neue Anfrage.
  global.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') {
      var s = global.document.getElementById('search');
      if (s) { e.preventDefault(); s.focus(); }
    } else if (e.key === 'n') {
      router.navigate('/form');
    }
  });

  // Höfliche Ansage des Seitenwechsels für Screenreader (ohne Fokus zu stehlen).
  function announceRoute() {
    var h = global.location.hash || '#/';
    var label = 'Startseite';
    if (h.indexOf('#/form') === 0) label = 'Suchanfrage-Formular';
    else if (h.indexOf('#/admin') === 0) label = 'Admin-Bereich';
    else if (h.indexOf('#/settings') === 0) label = 'Einstellungen';
    else if (h.indexOf('#/report') === 0) label = 'Deal-Report';
    else if (h.indexOf('#/success') === 0) label = 'Anfrage gesendet';
    else if (h.indexOf('#/datenschutz') === 0) label = 'Datenschutzerklärung';
    else if (h.indexOf('#/agb') === 0) label = 'AGB';
    else if (h.indexOf('#/impressum') === 0) label = 'Impressum';
    else if (h.indexOf('#/preise') === 0) label = 'Pakete & Preise';
    else if (h.indexOf('#/ueber-uns') === 0) label = 'Über uns';
    else if (h.indexOf('#/kontakt') === 0) label = 'Kontakt';
    else if (h.indexOf('#/ratgeber') === 0) label = 'Ratgeber';
    global.document.title = 'Töff Deal Scout — ' + label;
    var a = global.document.getElementById('route-announcer');
    if (a) a.textContent = 'Seite: ' + label;
  }
  global.addEventListener('hashchange', announceRoute);
  announceRoute();

  // Service Worker (PWA) — nur über http(s), nicht über file://.
  if ('serviceWorker' in global.navigator && global.location.protocol.indexOf('http') === 0) {
    global.addEventListener('load', function () {
      global.navigator.serviceWorker.register('sw.js').catch(function () { /* offline optional */ });
    });
  }
})(window);

</script>
</body>
</html>
